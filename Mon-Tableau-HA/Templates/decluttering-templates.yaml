# decluttering_templates:
tuiles_1:
  default:
    - tuile1_name: "Chauffage"
    - tuile1_entity: ""
  card:
    type: tile
    features:
      - type: target-temperature
    entity: "[[tuile1_entity]]"
    name: "[[tuile1_name]]"
    state_content:
      - current_temperature
      - hvac_action
    vertical: false
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
        }

tuiles_2:
  default:
    - tuile2_name: ""
    - tuile2_entity: ""
  card:
    type: tile
    name: "[[tuile2_name]]"
    entity: "[[tuile2_entity]]"
    hide_state: true
    vertical: false
    features:
      - type: target-temperature
      - type: climate-hvac-modes
        hvac_modes:
          - heat
          - cool
          - "off"
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
        }

tuiles_3:
  default:
    - tuile3_name: ""
    - tuile3_entity: ""
    - tuile3_icon: ""
  card:
    type: tile
    entity: "[[tuile3_entity]]"
    name: "[[tuile3_name]]"
    icon: "[[tuile3_icon]]"
    vertical: true
    tap_action:
      action: toggle
    icon_tap_action:
      action: more-info
    card_mod:
      style: |
        ha-card
          {
            box-shadow: var(--couleur_ombre_bleu);
          }

tuiles_4:
  default:
    - tuile4_entity: ""
  card:
    type: tile
    entity: "[[tuile4_entity]]"
    icon: mdi:cctv
    vertical: true
    hide_state: true
    tap_action:
      action: none
    icon_tap_action:
      action: none
    features:
      - type: alarm-modes
    features_position: inline
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
        }
     
tuiles_5:
  default:
    - tuile5_name: ""
    - tuile5_entity: ""
    - tuile5_icon: ""
    - tuile5_color: ""
  card:
    type: tile
    entity: "[[tuile5_entity]]"
    name: "[[tuile5_name]]"
    icon: "[[tuile5_icon]]"
    color: "[[tuile5_color]]"
    vertical: true
    tap_action:
      action: none
    icon_tap_action:
      action: none
    card_mod:
      style: |
        ha-card
          {
            box-shadow: var(--couleur_ombre_bleu);
          }

life360_personnes:
  default:
    - life360_nom: ""
    - life360_personne: ""
    - life360_pile: ""
    - life360_charge: ""
    - life360_deplacement: ""
    - life360_vitesse: ""
  card:
    type: tile
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
        }
    entity: "[[life360_personne]]"
    show_entity_picture: true
    vertical: true
    features_position: bottom
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: "[[life360_nom]]"
          content:
            type: entities
            entities:
              - type: custom:stack-in-card
                mode: vertical
                card_mod:
                  style: |
                    ha-card {
                    box-shadow: 0 0 0 2px gray;
                    }
                cards:
                  - type: tile
                    entity: "[[life360_personne]]"
                    features_position: bottom
                    vertical: false
                    show_entity_picture: true

                  - type: glance
                    entities:
                      - entity: "[[life360_pile]]"
                        name: Pile
                        icon: mdi:battery
                      - entity: "[[life360_charge]]"
                        name: En Charge
                        icon: mdi:flash
                      - entity: "[[life360_deplacement]]"
                        name: En Déplacement
                        icon: mdi:car
                      - entity: "[[life360_vitesse]]"
                        name: Vitesse
                        icon: mdi:speedometer

                  - type: map
                    entities:
                      - entity: "[[life360_personne]]"
                    theme_mode: dark
                    hours_to_show: 72
                    default_zoom: 11

piles:
  card:
    type: custom:auto-entities
    card:
      type: grid
      columns: "[[piles_columns]]"
    card_param: cards
    filter:
      include:
        - options:
            type: gauge
            min: 0
            max: 100
            severity:
              green: 66
              yellow: 33
              red: 0
            card_mod:
              style: |
                ha-card {
                  box-shadow: var(--couleur_ombre_bleu);
                }
          attributes:
            device_class: battery
          domain: sensor
      exclude:
        - entity_id: sensor.st_00032986_tension_de_la_batterie
    sort:
      method: state
      numeric: true
    show_empty: false

defi_hilo_card:
  card:
    type: conditional
    conditions:
      - condition: numeric_state
        entity: sensor.defi_hilo_count
        above: "[[id]]"
    card:
      type: custom:stack-in-card
      mode: vertical
      card_mod:
        style: |
          ha-card {
            border-radius:0px;
            border-style: solid none none none;
          }
      cards:
        - type: markdown
          content: >
            {% set defi = state_attr('sensor.defi_hilo','next_events')[[[id]]]
            %}

            {% set date =
            as_timestamp(defi.phases.preheat_start)|timestamp_custom("%d")|int
            %} {% set weekday =
            as_timestamp(defi.phases.preheat_start)|timestamp_custom("%w") %}
            {% set jour = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi',
            'Vendredi', 'Samedi'][int(weekday)] %} {% set dateToday =
            as_timestamp(now())|timestamp_custom("%d")|int %}

            {% if dateToday == date %}
              {% set descriptif = "Aujourd'hui" %}
            {% elif date - dateToday == 1 %}
              {% set descriptif = "Demain" %}
            {% else %}
              {% set descriptif = jour + " " + date %}
            {% endif %}

            ## {{descriptif}} {{defi.period.upper()}}
          card_mod:
            style: |
              ha-card {
                border-radius:0px;
                border-style: none;
              }
        - type: custom:stack-in-card
          mode: horizontal
          card_mod:
            style: |
              ha-card {
                border-radius:0px;
                border-style: none;
              }
          cards:
            - type: custom:decluttering-card
              template: defi_hilo_phase_card
              variables:
                - id: "[[id]]"
                - phase_state_name: appreciation
                - phase_attributes_name: appreciation
                - primary: Ancrage
                - icon: mdi:lightning-bolt
            - type: custom:decluttering-card
              template: defi_hilo_phase_card
              variables:
                - id: "[[id]]"
                - phase_state_name: pre_heat
                - phase_attributes_name: preheat
                - primary: Préchauffage
                - icon: mdi:timer-sand
            - type: custom:decluttering-card
              template: defi_hilo_phase_card
              variables:
                - id: "[[id]]"
                - phase_state_name: reduction
                - phase_attributes_name: reduction
                - primary: Réduction
                - icon: mdi:power-plug-off
            - type: custom:decluttering-card
              template: defi_hilo_phase_card
              variables:
                - id: "[[id]]"
                - phase_state_name: recovery
                - phase_attributes_name: recovery
                - primary: Reprise
                - icon: mdi:restart

defi_hilo_phase_card:
  default:
    - id: 0
    - phase_state_name: appreciation
    - phase_attributes_name: appreciation
    - primary: Ancrage
    - icon: mdi:anchor
    - entity: sensor.defi_hilo
  card:
    type: custom:mushroom-template-card
    entity: "[[entity]]"
    icon: "[[icon]]"
    primary: "[[primary]]"
    multiline_secondary: true
    layout: vertical
    tap_action:
      action: more-info
    card_mod:
      style:
        .: |
          ha-card {
            border-radius:0px;
            border-style: none;
          }
          mushroom-shape-icon {
            {% if is_state('[[entity]]', '[[phase_state_name]]') %}
            animation: dropshadow-change 2s linear infinite;
            {% endif %}
            test: '[[phase_state_name]]';
            test2: '[[entity]]';
          }
          @keyframes dropshadow-change {
            0% { filter: drop-shadow(0px 0px 2px rgba(0, 0, 0, 0)); }
            50% { filter: drop-shadow(0px 0px 8px green); }
            100% { filter: drop-shadow(0px 0px 2px rgba(0, 0, 0, 0)); }
          }
    secondary: >-
      {%- set phaseStart =
      as_timestamp(state_attr(entity,'next_events')[[[id]]]['phases']['[[phase_attributes_name]]_start'])
      -%} {%- set phaseEnd =
      as_timestamp(state_attr(entity,'next_events')[[[id]]]['phases']['[[phase_attributes_name]]_end'])
      -%} {%- set remainingTime = phaseStart - as_timestamp(now()) -%}

      {%- if remainingTime > 0 %} {{ phaseStart | timestamp_custom("%-Hh") }}
      à {{ phaseEnd | timestamp_custom("%-Hh") }}

      ⏱︎ {{ (phaseStart - as_timestamp(now())) | timestamp_custom("%-Hh%M",
      false) }} {%- elif is_state(entity, '[[phase_state_name]]') %} {{
      phaseStart | timestamp_custom("%-Hh") }} à {{ phaseEnd |
      timestamp_custom("%-Hh") }}

      ⏱︎ {{ (phaseEnd - as_timestamp(now())) | timestamp_custom("%-Hh%M",
      false) }} {%- else %} Complété! {%- endif -%}
    icon_color: >-
      {%- set phaseStart =
      as_timestamp(state_attr(entity,'next_events')[[[id]]]['phases']['[[phase_attributes_name]]_start'])
      -%} {%- set remainingTime = phaseStart - as_timestamp(now()) -%}

      {%- if is_state(entity, '[[phase_state_name]]') and (remainingTime <= 0)
      -%}
        green
      {%- endif -%}
    badge_icon: >-
      {% if
      as_timestamp(state_attr(entity,'next_events')[[[id]]]['phases']['[[phase_attributes_name]]_end'])
      - as_timestamp(now()) <= 0 %}
        mdi:check-bold
      {% endif %}
    badge_color: green

temp_int:
  card:
    type: custom:button-card
    entity: "[[temp_int_entity]]"
    show_state: false
    show_icon: false
    show_name: false
    tap_action: none
    double_tap_action: none
    hold_action: none
    custom_fields:
      icon:
        card:
          type: custom:button-card
          icon: mdi:thermometer
          styles:
            card:
              - aspect-ratio: 1/1
              - width: "[[[ return window.innerWidth <= 600 ? '20px' : '25px' ]]]"
              - border: none
              - border-radius: 50%
              - background: none
            icon:
              - width: "[[[ return window.innerWidth <= 600 ? '18px' : '20px' ]]]"
              - color: white
      icon_border:
        card:
          type: custom:button-card
          styles:
            card:
              - aspect-ratio: 1/1
              - width: "[[[ return window.innerWidth <= 600 ? '23px' : '25px' ]]]"
              - border: 1px solid white
              - border-radius: 50%
              - background: none
      name:
        card:
          type: custom:button-card
          name: Netatmo Température
          styles:
            card:
              - width: auto
              - padding: 0
              - border: none
              - border-radius: 0
              - background: none
            name:
              - font-size: "[[[ return window.innerWidth <= 600 ? '0.9rem' : '1.0rem' ]]]"
              - align-self: start
              - justify-self: start
              - color: white
              - font-weight: 500
      bar:
        card:
          type: custom:button-card
          show_name: false
          show_icon: false
          show_state: false
          styles:
            card:
              - height: 6px
              - width: |
                  [[[ return window.innerWidth <= 600 ? "220px" : "250px"; ]]]
              - border-radius: 999px
              - border: 0
              - padding: 0
              - background: |-
                  linear-gradient(to right,
                    rgba(255,0,0,1.0) 0%,
                    rgba(255,255,0,1.0) 12.5%,
                    rgba(0,255,0,1.0) 50%,
                    rgba(255,255,0,1.0) 62.5%,
                    rgba(255,120,0,1.0) 75%,
                    rgba(255,0,0,1.0) 100%)
      cursor:
        card:
          type: custom:button-card
          show_name: false
          show_icon: false
          show_state: false
          styles:
            card:
              - width: 12px
              - height: 25px
              - border-radius: 999px
              - border: 4px solid rgba(42,45,54,1.0)
              - background-color: |
                  [[[ 
                    const minTemp = 14;
                    const maxTemp = 30;
                    const temp = Number(entity.state) || minTemp;
                    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
                    const percent = clamp(((temp - minTemp) / (maxTemp - minTemp)) * 100, 0, 100);
                    const stops = [
                      { p: 0,   c: [255, 0, 0] },
                      { p: 12.5,c: [255, 255, 0] },
                      { p: 50,  c: [0, 255, 0] },
                      { p: 62.5,c: [255, 255, 0] },
                      { p: 75,  c: [255, 120, 0] },
                      { p: 100, c: [255, 0, 0] }
                    ];
                    let i = 1;
                    while (i < stops.length && percent > stops[i].p) i++;
                    const a = stops[i - 1], b = stops[i];
                    const t = (percent - a.p) / (b.p - a.p);
                    const lerp = (x, y, t) => Math.round(x + (y - x) * t);
                    const r = lerp(a.c[0], b.c[0], t);
                    const g = lerp(a.c[1], b.c[1], t);
                    const bcol = lerp(a.c[2], b.c[2], t);
                    return `rgba(${r},${g},${bcol},1.0)`;
                  ]]]
      value:
        card:
          type: custom:button-card
          show_name: false
          show_icon: false
          show_state: true
          state_display: |
            [[[ 
              const v = Number(entity.state); 
              return isNaN(v) ? '—' : v.toFixed(1); 
            ]]]
          styles:
            card:
              - width: auto
              - padding: 0
              - border: none
              - border-radius: 0
              - background: none
            state:
              - color: white
              - font-size: "[[[ return window.innerWidth <= 600 ? '1.6rem' : '1.8rem' ]]]"
              - font-weight: 700
      unit:
        card:
          type: custom:button-card
          name: °C
          styles:
            card:
              - width: auto
              - padding: 0
              - border: none
              - border-radius: 0
              - background: none
            name:
              - font-size: "[[[ return window.innerWidth <= 600 ? '1.1rem' : '1.3rem' ]]]"
              - align-self: start
              - justify-self: start
              - color: rgba(167,176,205,1.0)
              - font-weight: 800
      min_val:
        card:
          type: custom:button-card
          name: 15°C
          styles:
            card:
              - width: auto
              - padding: 0
              - border: none
              - border-radius: 0
              - background: none
            name:
              - font-size: "[[[ return window.innerWidth <= 600 ? '0.8rem' : '1.0rem' ]]]"
              - align-self: start
              - justify-self: start
              - color: rgba(167,176,205,1.0)
              - font-weight: 400
      max_val:
        card:
          type: custom:button-card
          name: 30°C
          styles:
            card:
              - width: auto
              - padding: 0
              - border: none
              - border-radius: 0
              - background: none
            name:
              - font-size: "[[[ return window.innerWidth <= 600 ? '0.8rem' : '1.0rem' ]]]"
              - align-self: start
              - justify-self: start
              - color: rgba(167,176,205,1.0)
              - font-weight: 400
      comment:
        card:
          type: custom:button-card
          show_name: true
          show_icon: false
          show_state: false
          name: |
            [[[ 
              const temp = Number(entity.state);
              if (isNaN(temp)) return "Indisponible";
              if (temp < 14) {
                return window.innerWidth <= 600 ? "En dehors<br>de l'échelle" : "En dehors de l'échelle";
              }
              if (temp >= 14 && temp < 16) return "Froid";
              if (temp >= 16 && temp < 18.5) return "Frais";
              if (temp >= 18.5 && temp <= 22) return "Confortable";
              if (temp > 22 && temp <= 24) return "Tiède";
              if (temp > 24 && temp < 27) return "Chaud";
              if (temp >= 27 && temp <= 30) return "Canicule";
              if (temp > 30) {
                return window.innerWidth <= 600 ? "En dehors<br>de l'échelle" : "En dehors de l'échelle";
              }
              return "Indisponible";
            ]]]
          styles:
            card:
              - height: 25px
              - width: auto
              - border-radius: 999px
              - border: none
              - padding: 0px 8px 0px 8px
              - background: white
              - background-color: |
                  [[[ 
                    const minTemp = 14;
                    const maxTemp = 30;
                    const temp = Number(entity.state);
                    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
                    const percent = isNaN(temp) ? 0 : clamp(((temp - minTemp) / (maxTemp - minTemp)) * 100, 0, 100);
                    const stops = [
                      { p: 0,   c: [255, 0, 0] },
                      { p: 12.5,c: [255, 255, 0] },
                      { p: 50,  c: [0, 255, 0] },
                      { p: 62.5,c: [255, 255, 0] },
                      { p: 75,  c: [255, 120, 0] },
                      { p: 100, c: [255, 0, 0] }
                    ];
                    let i = 1;
                    while (i < stops.length && percent > stops[i].p) i++;
                    const a = stops[i - 1], b = stops[i];
                    const t = (percent - a.p) / (b.p - a.p);
                    const lerp = (x, y, t) => Math.round(x + (y - x) * t);
                    const r = lerp(a.c[0], b.c[0], t);
                    const g = lerp(a.c[1], b.c[1], t);
                    const bcol = lerp(a.c[2], b.c[2], t);
                    return `rgba(${r},${g},${bcol},0.5)`;
                  ]]]
            name:
              - font-size: "[[[ return window.innerWidth <= 600 ? '0.8rem' : '0.9rem' ]]]"
              - font-weight: 600
              - line-height: |
                  [[[ 
                    return window.innerWidth <= 600 ? "0.9" : "normal";
                  ]]]
              - color: |
                  [[[ 
                    const minTemp = 14;
                    const maxTemp = 30;
                    const temp = Number(entity.state);
                    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
                    const percent = isNaN(temp) ? 0 : clamp(((temp - minTemp) / (maxTemp - minTemp)) * 100, 0, 100);
                    const stops = [
                      { p: 0,   c: [255, 0, 0] },
                      { p: 12.5,c: [255, 255, 0] },
                      { p: 50,  c: [0, 255, 0] },
                      { p: 62.5,c: [255, 255, 0] },
                      { p: 75,  c: [255, 120, 0] },
                      { p: 100, c: [255, 0, 0] }
                    ];
                    let i = 1;
                    while (i < stops.length && percent > stops[i].p) i++;
                    const a = stops[i - 1], b = stops[i];
                    const t = (percent - a.p) / (b.p - a.p);
                    const lerp = (x, y, t) => Math.round(x + (y - x) * t);
                    const r = lerp(a.c[0], b.c[0], t);
                    const g = lerp(a.c[1], b.c[1], t);
                    const bcol = lerp(a.c[2], b.c[2], t);
                    return `rgba(${r},${g},${bcol},1.0)`;
                  ]]]
    styles:
      card:
        - height: 74px
        - padding: 10px 0px
        - border-radius: 12px
        - overflow: visible
        - overflow: hidden
      custom_fields:
        icon:
          - position: absolute
          - top: 55%
          - left: 4%
          - transform: translate(-50%, -50%)
        icon_border:
          - position: absolute
          - top: "[[[ return window.innerWidth <= 600 ? '56%' : '55%' ]]]"
          - left: 4%
          - transform: translate(-50%, -50%)
        name:
          - position: absolute
          - top: "[[[ return window.innerWidth <= 600 ? '1%' : '3%' ]]]"
          - left: 8%
        value:
          - position: absolute
          - top: 0%
          - right: 6.5%
          - margin-top: "-0.5%"
        unit:
          - position: absolute
          - right: 2%
          - top: 1%
          - margin-left: 1%
        min_val:
          - position: absolute
          - bottom: 2%
          - left: "[[[ return window.innerWidth <= 600 ? '34%' : '38%' ]]]"
        max_val:
          - position: absolute
          - bottom: 2%
          - right: "[[[ return window.innerWidth <= 600 ? '2%' : '4%' ]]]"
        comment:
          - position: absolute
          - top: 55%
          - left: |
              [[[ 
                const iconLeftPercent = 1;
                const iconDiameterPx = window.innerWidth <= 600 ? 20 : 25;
                const barWidthPx = window.innerWidth <= 600 ? 220 : 250;
                const barRightPercent = window.innerWidth <= 600 ? 4 : 7;
                const iconRightExpr = `calc(${iconLeftPercent}% + ${iconDiameterPx}px)`;
                const barLeftExpr = `calc(100% - ${barRightPercent}% - ${barWidthPx}px)`;
                return `calc( ( ${iconRightExpr} + ${barLeftExpr} ) / 2 )`;
              ]]]
          - transform: translate(-50%, -50%)
        bar:
          - position: absolute
          - right: "[[[ return window.innerWidth <= 600 ? '4%' : '7%' ]]]"
          - top: 55%
          - transform: translateY(-50%)
        cursor:
          - position: absolute
          - top: "[[[ return 'calc(55% - 12.5px)'; ]]]"
          - left: |
              [[[ 
                const value = Number(entity.state);
                const min = 14;
                const max = 30;
                const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
                const t = clamp(value, min, max);
                const barWidth = window.innerWidth <= 600 ? 220 : 250;
                const halfCursor = 8;
                const barRightPercent = window.innerWidth <= 600 ? 4 : 7;
                const percent = (t - min) * 6.25;
                const offsetPx = (barWidth * percent) / 100;
                return `calc(100% - ${barRightPercent}% - ${barWidth}px + ${offsetPx}px - ${halfCursor}px)`;
              ]]]
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
        }
