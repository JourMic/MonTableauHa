# decluttering_templates:
tuiles_1:
  default:
    - tuile1_name: "Chauffage"
  card:
    type: tile
    features:
      - type: target-temperature
    entity: "[[tuile1_entity]]"
    name: "[[tuile1_name]]"
    state_content:
      - current_temperature
      - hvac_action
    features_position: bottom
    vertical: false
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
         }

tuiles_2:
  card:
    type: tile
    name: "[[tuile2_name]]"
    entity: "[[tuile2_entity]]"
    hide_state: true
    vertical: false
    features:
      - type: target-temperature
      - type: climate-hvac-modes
        hvac_modes:
          - heat
          - cool
          - "off"
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
        }

tuiles_3:
  default:
    - tuile3_icon: ""
    - tuile3_color: ""
    - tuile3_name: ""
  card:
    type: tile
    entity: "[[tuile3_entity]]"
    name: "[[tuile3_name]]"
    icon: "[[tuile3_icon]]"
    color: "[[tuile3_color]]"
    vertical: true
    tap_action:
      action: toggle
    icon_tap_action:
      action: more-info
    features_position: bottom
    card_mod:
      style: |
        ha-card
          {
            box-shadow: var(--couleur_ombre_bleu);
          }

tuiles_4:
  card:
    type: tile
    entity: "[[tuile4_entity]]"
    icon: mdi:cctv
    vertical: true
    hide_state: true
    tap_action:
      action: none
    icon_tap_action:
      action: none
    features:
      - type: alarm-modes
    features_position: inline
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
        }

tuiles_5:
  card:
    type: tile
    entity: "[[tuile5_entity]]"
    name: "[[tuile5_name]]"
    features:
      - type: trend-graph
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
        }

life360_personnes:
  default:
    - life360_nom: ""
    - life360_personne: ""
    - life360_pile: ""
    - life360_charge: ""
    - life360_deplacement: ""
    - life360_vitesse: ""
  card:
    type: tile
    card_mod:
      style: |
        ha-card {
          box-shadow: var(--couleur_ombre_bleu);
        }
    entity: "[[life360_personne]]"
    show_entity_picture: true
    vertical: true
    features_position: bottom
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: "[[life360_nom]]"
          content:
            type: entities
            entities:
              - type: custom:stack-in-card
                mode: vertical
                card_mod:
                  style: |
                    ha-card {
                    box-shadow: 0 0 0 2px gray;
                    }
                cards:
                  - type: tile
                    entity: "[[life360_personne]]"
                    features_position: bottom
                    vertical: false
                    show_entity_picture: true

                  - type: glance
                    entities:
                      - entity: "[[life360_pile]]"
                        name: Pile
                        icon: mdi:battery
                      - entity: "[[life360_charge]]"
                        name: En Charge
                        icon: mdi:flash
                      - entity: "[[life360_deplacement]]"
                        name: En Déplacement
                        icon: mdi:car
                      - entity: "[[life360_vitesse]]"
                        name: Vitesse
                        icon: mdi:speedometer

                  - type: map
                    entities:
                      - entity: "[[life360_personne]]"
                    theme_mode: dark
                    hours_to_show: 72
                    default_zoom: 11
        
piles:
  card:
    type: custom:auto-entities
    card:
      type: grid
      columns: "[[piles_columns]]"
    card_param: cards
    filter:
      include:
        - options:
            type: gauge
#            needle: true
            min: 0
            max: 100
            severity:
              green: 66
              yellow: 33
              red: 0
            card_mod:
              style: |
                ha-card {
                   box-shadow: var(--couleur_ombre_bleu);
                }
          attributes:
            device_class: battery
          domain: sensor
      exclude:
        - entity_id: sensor.st_00032986_tension_de_la_batterie
    sort:
      method: state
      numeric: true
    show_empty: false

defi_hilo_card:
  card:
    type: conditional
    conditions:
      - condition: numeric_state
        entity: sensor.defi_hilo_count
        above: "[[id]]"
    card:
      type: custom:stack-in-card
      mode: vertical
      card_mod:
        style: |
          ha-card {
            border-radius:0px;
            border-style: solid none none none;
          }
      cards:
        - type: markdown
          content: >
            {% set defi = state_attr('sensor.defi_hilo','next_events')[[[id]]]
            %}

            {% set date =
            as_timestamp(defi.phases.preheat_start)|timestamp_custom("%d")|int
            %} {% set weekday =
            as_timestamp(defi.phases.preheat_start)|timestamp_custom("%w") %}
            {% set jour = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi',
            'Vendredi', 'Samedi'][int(weekday)] %} {% set dateToday =
            as_timestamp(now())|timestamp_custom("%d")|int %}

            {% if dateToday == date %}
              {% set descriptif = "Aujourd'hui" %}
            {% elif date - dateToday == 1 %}
              {% set descriptif = "Demain" %}
            {% else %}
              {% set descriptif = jour + " " + date %}
            {% endif %}

            ## {{descriptif}} {{defi.period.upper()}}
          card_mod:
            style: |
              ha-card {
                border-radius:0px;
                border-style: none;
              }
        - type: custom:stack-in-card
          mode: horizontal
          card_mod:
            style: |
              ha-card {
                border-radius:0px;
                border-style: none;
              }
          cards:
            - type: custom:decluttering-card
              template: defi_hilo_phase_card
              variables:
                - id: "[[id]]"
                - phase_state_name: appreciation
                - phase_attributes_name: appreciation
                - primary: Ancrage
                - icon: mdi:lightning-bolt
            - type: custom:decluttering-card
              template: defi_hilo_phase_card
              variables:
                - id: "[[id]]"
                - phase_state_name: pre_heat
                - phase_attributes_name: preheat
                - primary: Préchauffage
                - icon: mdi:timer-sand
            - type: custom:decluttering-card
              template: defi_hilo_phase_card
              variables:
                - id: "[[id]]"
                - phase_state_name: reduction
                - phase_attributes_name: reduction
                - primary: Réduction
                - icon: mdi:power-plug-off
            - type: custom:decluttering-card
              template: defi_hilo_phase_card
              variables:
                - id: "[[id]]"
                - phase_state_name: recovery
                - phase_attributes_name: recovery
                - primary: Reprise
                - icon: mdi:restart

defi_hilo_phase_card:
  default:
    - id: 0
    - phase_state_name: appreciation
    - phase_attributes_name: appreciation
    - primary: Ancrage
    - icon: mdi:anchor
    - entity: sensor.defi_hilo
  card:
    type: custom:mushroom-template-card
    entity: "[[entity]]"
    icon: "[[icon]]"
    primary: "[[primary]]"
    multiline_secondary: true
    layout: vertical
    tap_action:
      action: more-info
    card_mod:
      style:
        .: |
          ha-card {
            border-radius:0px;
            border-style: none;
          }
          mushroom-shape-icon {
            {% if is_state('[[entity]]', '[[phase_state_name]]') %}
            animation: dropshadow-change 2s linear infinite;
            {% endif %}
            test: '[[phase_state_name]]';
            test2: '[[entity]]';
          }
          @keyframes dropshadow-change {
            0% { filter: drop-shadow(0px 0px 2px rgba(0, 0, 0, 0)); }
            50% { filter: drop-shadow(0px 0px 8px green); }
            100% { filter: drop-shadow(0px 0px 2px rgba(0, 0, 0, 0)); }
          }
    secondary: >-
      {%- set phaseStart =
      as_timestamp(state_attr(entity,'next_events')[[[id]]]['phases']['[[phase_attributes_name]]_start'])
      -%} {%- set phaseEnd =
      as_timestamp(state_attr(entity,'next_events')[[[id]]]['phases']['[[phase_attributes_name]]_end'])
      -%} {%- set remainingTime = phaseStart - as_timestamp(now()) -%}

      {%- if remainingTime > 0 %} {{ phaseStart | timestamp_custom("%-Hh") }}
      à {{ phaseEnd | timestamp_custom("%-Hh") }}

      ⏱︎ {{ (phaseStart - as_timestamp(now())) | timestamp_custom("%-Hh%M",
      false) }} {%- elif is_state(entity, '[[phase_state_name]]') %} {{
      phaseStart | timestamp_custom("%-Hh") }} à {{ phaseEnd |
      timestamp_custom("%-Hh") }}

      ⏱︎ {{ (phaseEnd - as_timestamp(now())) | timestamp_custom("%-Hh%M",
      false) }} {%- else %} Complété! {%- endif -%}
    icon_color: >-
      {%- set phaseStart =
      as_timestamp(state_attr(entity,'next_events')[[[id]]]['phases']['[[phase_attributes_name]]_start'])
      -%} {%- set remainingTime = phaseStart - as_timestamp(now()) -%}

      {%- if is_state(entity, '[[phase_state_name]]') and (remainingTime <= 0)
      -%}
        green
      {%- endif -%}
    badge_icon: >-
      {% if
      as_timestamp(state_attr(entity,'next_events')[[[id]]]['phases']['[[phase_attributes_name]]_end'])
      - as_timestamp(now()) <= 0 %}
        mdi:check-bold
      {% endif %}
    badge_color: green
