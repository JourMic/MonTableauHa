title: Météo
path: Vue-Meteos
icon: mdi:weather-partly-lightning
subview: false
type: sections
max_columns: 2
cards: []
sections:

  - type: grid
    column_span: 2
    cards:
    
      - type: heading
        heading: "Position du Soleil + UV"
        icon: mdi:white-balance-sunny
        grid_options:
          columns: 24
          rows: 0.4
    
      - type: custom:button-card
        entity: sun.sun
        update_timer: 10s
        show_icon: false
        show_name: true
        show_label: true
        show_state: false
        show_entity_picture: true
        tap_action:
          action: more-info
        hold_action:
          action: more-info
          entity: sensor.st_00032986_index_uv
        entity_picture: |
          [[[
            return entity.state == "below_horizon"
              ? "/local/weather/animated/night.svg"
              : "/local/weather/animated/day.svg";
          ]]]
        name: |
          [[[
            const sunrise = new Date(states["sensor.sun_next_rising"].state);
            const sunset = new Date(states["sensor.sun_next_setting"].state);

            function heure(d){
              return d.toLocaleTimeString("fr-FR",
              {hour:"2-digit",minute:"2-digit"}).replace(":","h");
            }

            if (sunrise < sunset)
              return `Soleil sous l'horizon | Prochain lever: ${heure(sunrise)}`;

            return `Soleil au-dessus de l'horizon | Prochain coucher: ${heure(sunset)}`;
          ]]]
        label: |
          [[[
              const sunrise = new Date(states["sensor.sun_next_rising"].state);
              const sunset = new Date(states["sensor.sun_next_setting"].state);

              const next = sunrise < sunset ? sunrise : sunset;

              let sec = Math.floor((next-new Date())/1000);

              if(sec<=0)
                return "Maintenant";

              const d=Math.floor(sec/86400);
              sec%=86400;
              const h=Math.floor(sec/3600);
              sec%=3600;
              const m=Math.floor(sec/60);
              const s=sec%60;

              return `Dans ${d?d+"j ":""}${String(h).padStart(2,"0")}h${String(m).padStart(2,"0")}m${String(s).padStart(2,"0")}s`;
          ]]]
        custom_fields:
          uv: |
            [[[
              if (entity.state == "below_horizon") return "";
              return Math.round(Number(states["sensor.st_00032986_index_uv"].state));
             ]]]
          progress: |
            [[[
              const sunrise = new Date(states['sensor.sun_next_rising'].state);
              const sunset = new Date(states['sensor.sun_next_setting'].state);
              const now = new Date();

              let start, end, icon, gradient;

              if (sunrise < sunset) {
                // Nuit
                end = sunrise;
                start = new Date(sunrise);
                start.setDate(start.getDate()-1);

                icon = "🌙";
                gradient = "linear-gradient(90deg,#435CFF,#5C6BC0,#FFF59D)";
              } else {
                // Jour
                start = new Date(sunset);
                start.setDate(start.getDate()-1);
                end = sunset;

                icon = "☀️";
                gradient = "linear-gradient(90deg,#FFE082,#FFB300,#F57C00)";
              }

              let pct = ((now - start) / (end - start)) * 100;
              pct = Math.max(0, Math.min(100, pct));
              
              const iconPct = Math.max(2, Math.min(98, pct));

              return `
              <div style="
                  position:relative;
                  width:100%;
                  height:8px;
                  border-radius:999px;
                  background:rgba(255,255,255,.18);
                  overflow:visible;">

                  <div style="
                      width:${pct}%;
                      height:100%;
                      border-radius:999px;
                      background:${gradient};">
                  </div>

                  <div style="
                      position:absolute;
                      left: calc(${iconPct}% - 10px);
                      top:20%;
                      transform:translateY(-55%);
                      font-size:19px;
                      transition:left 1s linear;">
                      ${icon}
                  </div>

              </div>`;
            ]]]   
        styles:
          card:
            - height: 58px
            - padding: 3px 0px
            - border-radius: 12px
            - overflow: visible
            - overflow: hidden
            - background: |
                [[[
                  return entity.state=="below_horizon"
                  ? "linear-gradient(180deg,#40445a 0%, rgba(64,68,90,.15) 250%)"
                  : "linear-gradient(180deg,#44739e 0%, rgba(68,115,158,.15) 250%)";
                ]]]
            - "--button-card-ripple-icon-hover-opacity": 0.3
            - "--button-card-ripple-icon-pressed-opacity": 0.3
            - "--button-card-ripple-color": |
                [[[
                  return entity.state=="below_horizon"
                  ? "#f9e491"
                  : "#ffe54d";
                ]]]      
          grid:
            - grid-template-areas: |
                "i n"
                "i l "
                "i progress"
            - grid-template-columns: 54px 1fr
            - grid-template-rows: min-content min-content 7px
          img_cell:
            - width: 54px
            - height: 54px
            - justify-content: center
            - align-items: center
          icon:
            - width: 80px
            - height: 80px
          name:
            - align-self: end
            - justify-self: start
            - font-size: 16px
            - font-weight: 500
            - color: white
          label:
            - justify-self: start
            - align-self: start
            - font-size: 15px
            - font-weight: bold
            - padding-bottom: 8px
            - color: |
                [[[
                  return entity.state=="below_horizon"
                  ? "#f9e491"
                  : "#ffe54d";
                ]]]
          custom_fields:
            progress:
              - justify-self: stretch
              - align-self: center
              - overflow: visible
              - width: calc(100% - 10px)
              - padding-bottom: 12px
              - filter: drop-shadow(0 1px 2px rgba(0,0,0,.35))
            uv:
              - position: absolute
              - top: 3px
              - left: 34px
              - width: 16px
              - height: 16px
              - border-radius: 50%
              - display: |
                  [[[
                     return entity.state == "below_horizon"
                       ? "none"
                       : "flex";
                  ]]]
              - justify-content: center
              - align-items: center
              - font-size: 11px
              - font-weight: bold
              - color: white
              - z-index: 10
              - box-shadow: 0 2px 5px rgba(0,0,0,.35)
              - background-color: |
                  [[[
                    const uv = Number(states['sensor.st_00032986_index_uv'].state);

                    if (uv >= 11) return "purple";
                    if (uv >= 8) return "firebrick";
                    if (uv >= 6) return "darkorange";
                    if (uv >= 3) return "gold";
                    return "forestgreen";
                  ]]]
        card_mod:
          style: "ha-card {\n  box-shadow: var(--couleur_ombre_bleu) !important;\n}  \_\n"
        grid_options:
          columns: 24
          rows: auto

  - type: grid
    column_span: 1
    cards:

      - type: heading
        heading_style: title
        icon: mdi:weather-partly-snowy-rainy
        heading: Prévisions
        grid_options:
          columns: full
          rows: 0.4

      - type: custom:weather-forecast-card
        entity: weather.pirateweather
        show_current: true
        show_forecast: true
        name: Shawinigan-Sud
        default_forecast: daily
        show_condition_effects: true
        current:
          show_attributes:
            - name: humidity
              entity: sensor.st_00032986_humidite
            - name: pressure
              entity: sensor.st_00032986_pression_atmospherique
            - name: uv_index
              entity: sensor.st_00032986_index_uv
            - name: visibility
              entity: sensor.shawinigan_sud_sensors_visibility
          secondary_info_attribute: apparent_temperature
          temperature_entity: sensor.st_00032986_temperature
          temperature_precision: 1
        forecast:
          mode: chart
          extra_attribute: wind_direction
          scroll_to_selected: true
          use_color_thresholds: true
          daily_slots: 7
          show_attribute_selector: false
          temperature_precision: 1
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre_bleu) !important;
            }
        grid_options:
          columns: 12
          rows: auto

  - type: grid
    cards:
      - type: heading
        heading_style: title
        icon: mdi:eye
        heading: Vent
        grid_options:
          columns: full
          rows: 0.3

      - type: custom:windrose-card
        title: Direction du vent
        data_period:
          period_back: "-4h"
        refresh_interval: 300
        windspeed_bar_location: right
        buttons_config:
          location: bottom
          buttons:
            - type: period_selector
              button_text: 1 heure
              period_back: "-1h"
            - type: period_selector
              button_text: 4 heures
              period_back: "-4h"
        wind_direction_entity:
          entity: sensor.st_00032986_direction_du_vent
          use_statistics: false
          direction_compensation: 0
        windspeed_entities:
          - entity: sensor.st_00032986_vitesse_du_vent
            name: Vitesse
            speed_unit: auto
            output_speed_unit: kph
            speed_range_beaufort: false
            windspeed_bar_full: true
            current_speed_arrow: true
            use_statistics: false
          - entity: sensor.st_00032986_rafales
            name: Rafale
            speed_unit: auto
            output_speed_unit: kph
            speed_range_beaufort: false
            windspeed_bar_full: true
            current_speed_arrow: true
            use_statistics: false
        matching_strategy:
          name: direction-first
        rose_config:
          windrose_draw_north_offset: 0
          center_calm_percentage: true
        current_direction:
          show_arrow: true
        corner_info:
          top_left:
            label: Vitesse
            unit: null
            entity: sensor.st_00032986_vitesse_du_vent
          bottom_left:
            label: Rafale
            unit: null
            entity: sensor.st_00032986_rafales
          top_right:
            label: Direction
            unit: °
            color: red
            entity: sensor.st_00032986_direction_du_vent
          bottom_right:
            label: Moyenne
            unit: null
            entity: sensor.weatherflow_direction_moyenne_du_vent
        direction_labels:
          cardinal_direction_letters: NESO
          show_cardinal_directions: true
          show_intercardinal_directions: true
          show_secondary_intercardinal_directions: true
          cardinal_directions_text_size: 60
          intercardinal_directions_text_size: 45
          secondary_intercardinal_directions_text_size: 30
        grid_options:
          columns: 12
          rows: auto
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre_bleu) !important;
            }

badges:
  - type: entity
    entity: sensor.shawinigan_sud_sensors_precipitation_today
    show_name: false
    show_state: true
    show_icon: true
    tap_action:
      action: navigate
      navigation_path: /tableau-ha/Sous-Vue-Pluie

  - type: entity
    entity: sensor.shawinigan_sud_sensors_precipitation_today
    show_name: true
    show_state: false
    show_icon: true
    icon: mdi:radar
    name: Radar
    tap_action:
      action: navigate
      navigation_path: /tableau-ha/Sous-Vue-Radar

  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    color: red
    entity: sensor.mauricie_quebec_canada_indice_de_qualite_de_l_air
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: IQA
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      box-shadow: 0 0 0 2px gray;
                    }
                cards:
                  - type: custom:mini-graph-card
                    icon: mdi:air-purifier
                    name: IQA
                    hours_to_show: 128
                    hour24: true
                    show:
                      extrema: true
                      graph: bar
                      name: true
                      icon: true
                      state: true
                    entities:
                      - entity: sensor.mauricie_quebec_canada_indice_de_qualite_de_l_air
                    color_thresholds:
                      - value: 0
                        color: green
                      - value: 51
                        color: yellow
                      - value: 101
                        color: orange
                      - value: 151
                        color: red
                      - value: 201
                        color: purple
                      - value: 301
                        color: brown
                  - show_name: true
                    show_icon: true
                    show_state: true
                    type: glance
                    entities:
                      - entity: sensor.mauricie_quebec_canada_pm2_5
                        icon: mdi:air-filter
                        name: PM 2.5
                      - entity: sensor.mauricie_quebec_canada_ozone
                        name: Ozone
                        icon: mdi:chart-box-outline
                      - entity: sensor.mauricie_quebec_canada_dominant_pollutant
                        icon: mdi:arrow-up-bold-circle
                        name: Dominant

  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    icon: mdi:sun-wireless
    color: cyan
    entity: sensor.st_00032986_index_uv
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: UV
          content:
            type: entities
            entities:
              - type: custom:mini-graph-card
                icon: mdi:sun-wireless
                name: Index UV
                hours_to_show: 120
                hour24: true
                show:
                  extrema: true
                  graph: bar
                  name: true
                  icon: true
                  state: true
                entities:
                   - entity: sensor.st_00032986_index_uv
                color_thresholds:
                  - value: 0
                    color: green
                  - value: 3
                    color: yellow
                  - value: 6
                    color: orange
                  - value: 11
                    color: red
 
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    color: orange
    entity: sensor.shawinigan_sud_sensors_lightning_strikes_last_3_hours
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Nombre d'éclaire
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      box-shadow: 0 0 0 2px gray;
                    }
                cards:
                  - type: glance
                    show_name: true
                    show_icon: true
                    show_state: true
                    entities:
                      - entity: sensor.shawinigan_sud_sensors_lightnings_strikes
                        tap_action:
                          action: none
                        name: 1 Minute
                      - entity: >-
                          sensor.shawinigan_sud_sensors_lightning_strikes_last_hour
                        tap_action:
                          action: none
                        name: 1 Heure
                      - entity: >-
                          sensor.shawinigan_sud_sensors_lightning_strikes_last_3_hours
                        tap_action:
                          action: none
                        name: 3 Heures
                      - entity: >-
                          sensor.shawinigan_sud_sensors_distance_last_lightning_strike
                        tap_action:
                          action: none
                        name: Distance
                    title: "Foudres Détectés "
                    state_color: true
                    card_mod:
                      style: |
                        :host {
                          font-size: 24px; 
                          height: 60px;
                        }
