title: Météo
path: Vue-Meteos
icon: mdi:weather-partly-lightning
subview: false
type: sections
max_columns: 2
cards: []
sections:

  - type: grid
    cards:
    
      - type: heading
        heading: "Position du Soleil + UV"
        icon: mdi:white-balance-sunny
        grid_options:
          columns: 12
          rows: 0.5
    
      - type: custom:button-card
        entity: sun.sun
        update_timer: 10s
        show_icon: false
        show_name: true
        show_label: true
        show_state: false
        show_entity_picture: true
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Soleil Lune
              content:
                type: entities
                entities:
                  - type: custom:horizon-card
                    title: Horizon
                    moon: true
                    refresh_period: 60
                    fields:
                      sunrise: true
                      sunset: true
                      dawn: true
                      noon: true
                      dusk: true
                      azimuth: true
                      sun_azimuth: true
                      moon_azimuth: true
                      elevation: true
                      sun_elevation: true
                      moon_elevation: true
                      moonrise: true
                      moonset: true
                      moon_phase: true
                    southern_flip: false
                    language: fr
                    time_format: language
                    number_format: language
                    no_card: false
                    debug_level: 0
                    moon_phase_rotation: -10
                    card_mod:
                      style: |
                        ha-card {
                          box-shadow: 0 0 0 2px gray;
                        }

        hold_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: UV
              content:
                type: entities
                entities:
                  - type: custom:mini-graph-card
                    icon: mdi:sun-wireless
                    name: Index UV
                    hours_to_show: 120
                    hour24: true
                    show:
                      extrema: true
                      graph: bar
                      name: true
                      icon: true
                      state: true
                    entities:
                      - entity: sensor.st_00032986_index_uv
                    color_thresholds:
                      - value: 0
                        color: green
                      - value: 3
                        color: yellow
                      - value: 6
                        color: orange
                      - value: 11
                        color: red
        entity_picture: |
          [[[
            return entity.state == "below_horizon"
              ? "/local/weather/animated/night.svg"
              : "/local/weather/animated/day.svg";
          ]]]
        name: |
          [[[
            const sunrise = new Date(states["sensor.sun_next_rising"].state);
            const sunset = new Date(states["sensor.sun_next_setting"].state);

            function heure(d){
              return d.toLocaleTimeString("fr-FR",
              {hour:"2-digit",minute:"2-digit"}).replace(":","h");
            }

            if (sunrise < sunset)
              return `Soleil sous l'horizon | Prochain lever: ${heure(sunrise)}`;

            return `Soleil au-dessus de l'horizon | Prochain coucher: ${heure(sunset)}`;
          ]]]
        label: |
          [[[
              const sunrise = new Date(states["sensor.sun_next_rising"].state);
              const sunset = new Date(states["sensor.sun_next_setting"].state);

              const next = sunrise < sunset ? sunrise : sunset;

              let sec = Math.floor((next - new Date()) / 1000);

              if (sec <= 0)
                return "Maintenant";

              const d = Math.floor(sec / 86400);
              sec %= 86400;
              const h = Math.floor(sec / 3600);
              sec %= 3600;
              const m = Math.floor(sec / 60);
              const s = sec % 60;

              let txt = "Dans ";
              
              if (d > 0) txt += `${d}j `;
              
              if (h > 0) {
                txt += `${String(h).padStart(2,"0")}h`;
                txt += `${String(m).padStart(2,"0")}m`;
              } else if (m > 0) {
                txt += `${m}m`;
              }
              
              txt += `${String(s).padStart(2,"0")}s`;
              
              return txt;
          ]]]
        custom_fields:
          uv: |
            [[[
              if (entity.state == "below_horizon") return "";
              return Math.round(Number(states["sensor.st_00032986_index_uv"].state));
            ]]]
          progress: |
            [[[
              const sunrise = new Date(states['sensor.sun_next_rising'].state);
              const sunset = new Date(states['sensor.sun_next_setting'].state);
              const now = new Date();

              let start, end, icon, gradient, offset;

              if (sunrise < sunset) {
                // Nuit
                end = sunrise;
                start = new Date(sunrise);
                start.setDate(start.getDate()-1);

                icon = "🌙";
                offset = 17;
                gradient = "linear-gradient(90deg,#435CFF,#5C6BC0,#FFF59D)";
              } else {
                // Jour
                start = new Date(sunset);
                start.setDate(start.getDate()-1);
                end = sunset;

                icon = "☀️";
                offset = 12;
                gradient = "linear-gradient(90deg,#FFE082,#FFB300,#F57C00)";
              }

              let pct = ((now - start) / (end - start)) * 100;
              pct = Math.max(0, Math.min(100, pct));
              
              const iconPct = Math.max(2, Math.min(98, pct));

              return `
              <div style="
                  position:relative;
                  width:100%;
                  height:8px;
                  border-radius:999px;
                  background:rgba(255,255,255,.18);
                  overflow:visible;">

                  <div style="
                      width:${pct}%;
                      height:100%;
                      border-radius:999px;
                      background:${gradient};">
                  </div>

                  <div style="
                      position:absolute;
                      left: calc(${iconPct}% - ${offset}px);
                      top:20%;
                      transform:translateY(-55%);
                      font-size:19px;
                      transition:left 1s linear;">
                      ${icon}
                  </div>

              </div>`;
            ]]]   
        styles:
          card:
            - height: 74px
            - padding: 10px 0px
            - border-radius: 12px
            - overflow: visible
            - overflow: hidden
          grid:
            - grid-template-areas: |
                "i n"
                "i l "
                "i progress"
            - grid-template-columns: 54px 1fr
            - grid-template-rows: min-content min-content 7px
          img_cell:
            - width: 54px
            - height: 54px
            - justify-content: center
            - align-items: center
          icon:
            - width: 80px
            - height: 80px
          name:
            - align-self: end
            - justify-self: start
            - font-size: 16px
            - font-weight: 500
            - color: white
          label:
            - justify-self: start
            - align-self: start
            - font-size: 15px
            - font-weight: bold
            - padding-bottom: 8px
            - color: |
                [[[
                  return entity.state=="below_horizon"
                  ? "#f9e491"
                  : "#ffe54d";
                ]]]
          custom_fields:
            progress:
              - justify-self: stretch
              - align-self: center
              - overflow: visible
              - width: calc(100% - 10px)
              - padding-bottom: 12px
              - filter: drop-shadow(0 1px 2px rgba(0,0,0,.35))
            uv:
              - position: absolute
              - top: 10px
              - left: 34px
              - width: 16px
              - height: 16px
              - border-radius: 50%
              - display: |
                  [[[
                    return entity.state == "below_horizon"
                      ? "none"
                      : "flex";
                  ]]]
              - justify-content: center
              - align-items: center
              - font-size: 11px
              - font-weight: bold
              - color: white
              - z-index: 10
              - box-shadow: 0 2px 5px rgba(0,0,0,.35)
              - background-color: |
                  [[[
                    const uv = Number(states['sensor.st_00032986_index_uv'].state);

                    if (uv >= 11) return "purple";
                    if (uv >= 8) return "firebrick";
                    if (uv >= 6) return "darkorange";
                    if (uv >= 3) return "gold";
                    return "forestgreen";
                  ]]]
        card_mod:
          style: "ha-card {\n  box-shadow: var(--couleur_ombre_bleu) !important;\n}  \_\n"
        grid_options:
          columns: 12
          rows: auto
          
      - type: heading
        heading_style: title
        icon: mdi:weather-partly-snowy-rainy
        heading: Prévisions
        grid_options:
          columns: full
          rows: 0.3

      - type: custom:sun-weather-card
        entity: weather.pirateweather
        details:
          - humidity
          - wind_speed
          - precipitation_probability
          - pressure
          - wind_bearing
          - precipitation
          - visibility
          - dew_point
          - apparent_temperature
          - cloud_coverage
          - sunrise
          - sunset
        show_forecast_toggle: false
        visible_rows: 5
        transparent: false
        forecast_layout: bars
        location: Shawinigan
        show_time: false
        show_date: false
        background_overlay: 0
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre_bleu) !important;
            }
        grid_options:
          columns: 12
          rows: auto

  - type: grid
    cards:
    
      - type: heading
        heading: "Température"
        icon: mdi:thermometer
        grid_options:
          columns: 12
          rows: 0.5
          
      - type: custom:button-card
        entity: sensor.st_00032986_temperature
        show_state: false
        show_icon: false
        show_name: false
        tap_action: none
        double_tap_action: none
        hold_action: none
        custom_fields:
          icon:
            card:
              type: custom:button-card
              icon: mdi:thermometer
              styles:
                card:
                  - aspect-ratio: 1/1
                  - width: "[[[ return window.innerWidth <= 600 ? '20px' : '25px' ]]]"
                  - border: none
                  - border-radius: 50%
                  - background: none
                icon:
                  - width: "[[[ return window.innerWidth <= 600 ? '18px' : '20px' ]]]"
                  - color: white
          icon_border:
            card:
              type: custom:button-card
              styles:
                card:
                  - aspect-ratio: 1/1
                  - width: "[[[ return window.innerWidth <= 600 ? '23px' : '25px' ]]]"
                  - border: 1px solid white
                  - border-radius: 50%
                  - background: none
          name:
            card:
              type: custom:button-card
              name: WeatherFlow Tempest
              styles:
                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '0.9rem' : '1.0rem'
                      ]]]
                  - align-self: start
                  - justify-self: start
                  - color: white
                  - font-weight: 500
          bar:
            card:
              type: custom:button-card
              show_name: false
              show_icon: false
              show_state: false
              styles:
                card:
                  - height: 6px
                  - width: >
                      [[[ return window.innerWidth <= 600 ? "220px" : "250px";
                      ]]]
                  - border-radius: 999px
                  - border: 0
                  - padding: 0
                  - background: |-
                      linear-gradient(to right, rgba(0,0,255,1.0) 0%,
                      rgba(0,165,255,1.0) 40%, rgba(0,255,0,1.0) 65%,
                      rgba(255,255,0,1.0) 75%, rgba(255,0,0,1.0) 100%)
          cursor:
            card:
              type: custom:button-card
              show_name: false
              show_icon: false
              show_state: false
              styles:
                card:
                  - width: 12px
                  - height: 25px
                  - border-radius: 999px
                  - border: 4px solid rgba(42,45,54,1.0)
                  - background-color: |
                      [[[ 
                        const minTemp = -40;
                        const maxTemp = 40;
                        const temp = Number(entity.state) || minTemp;
                        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
                        const percent = clamp(((temp - minTemp) / (maxTemp - minTemp)) * 100, 0, 100);
                        const stops = [
                          { p: 0,   c: [0, 0, 255, 1.0] },
                          { p: 40,c: [0, 165, 255, 1.0] },
                          { p: 65,  c: [0, 255, 0, 1.0] },
                          { p: 75,c: [255, 255, 0, 1.0] },
                          { p: 100, c: [255, 0, 0, 1.0] }
                        ];
                        let i = 1;
                        while (i < stops.length && percent > stops[i].p) i++;
                        const a = stops[i - 1], b = stops[i];
                        const t = (percent - a.p) / (b.p - a.p);
                        const lerp = (x, y, t) => Math.round(x + (y - x) * t);
                        const r = lerp(a.c[0], b.c[0], t);
                        const g = lerp(a.c[1], b.c[1], t);
                        const bcol = lerp(a.c[2], b.c[2], t);
                        return `rgba(${r},${g},${bcol},1.0)`;
                      ]]]
          value:
            card:
              type: custom:button-card
              show_name: false
              show_icon: false
              show_state: true
              state_display: |
                [[[ 
                  const v = Number(entity.state); 
                  return isNaN(v) ? '—' : v.toFixed(1); 
                ]]]
              styles:
                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                state:
                  - color: white
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '1.6rem' : '1.8rem'
                      ]]]
                  - font-weight: 700
          unit:
            card:
              type: custom:button-card
              name: °C
              styles:
                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '1.1rem' : '1.3rem'
                      ]]]
                  - align-self: start
                  - justify-self: start
                  - color: rgba(167,176,205,1.0)
                  - font-weight: 800
          min_val:
            card:
              type: custom:button-card
              name: "-40°C"
              styles:
                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '0.8rem' : '1.0rem'
                      ]]]
                  - align-self: start
                  - justify-self: start
                  - color: rgba(167,176,205,1.0)
                  - font-weight: 400
          max_val:
            card:
              type: custom:button-card
              name: 40°C
              styles:
                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '0.8rem' : '1.0rem'
                      ]]]
                  - align-self: start
                  - justify-self: start
                  - color: rgba(167,176,205,1.0)
                  - font-weight: 400
          comment:
            card:
              type: custom:button-card
              show_name: true
              show_icon: false
              show_state: false
              name: |
                [[[
                  const temp = Number(entity.state);
                  if (temp < -25) return "Froid extrême";
                  if (temp >= -25 && temp < 0) return "Très froid";
                  if (temp >= 0 && temp < 10) return "Froid";
                  if (temp >= 10 && temp < 15) return "Frais";
                  if (temp >= 15 && temp < 25) return "Confortable";
                  if (temp >= 25 && temp < 30) return "Chaud";
                  if (temp >= 30 && temp < 40) return "Très chaud";
                  if (temp >= 40) return "Chaleur extrême";
                ]]]
              styles:
                card:
                  - height: 25px
                  - width: auto
                  - border-radius: 999px
                  - border: none
                  - padding: 0px 8px 0px 8px
                  - background: white
                  - background-color: |
                      [[[ 
                        const minTemp = -40;
                        const maxTemp = 40;
                        const temp = Number(entity.state);
                        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
                        const percent = isNaN(temp) ? 0 : clamp(((temp - minTemp) / (maxTemp - minTemp)) * 100, 0, 100);
                        const stops = [
                          { p: 0,   c: [0, 0, 255, 1.0] },
                          { p: 40,c: [0, 165, 255, 1.0] },
                          { p: 65,  c: [0, 255, 0, 1.0] },
                          { p: 75,c: [255, 255, 0, 1.0] },
                          { p: 100, c: [255, 0, 0, 1.0] }
                        ];
                        let i = 1;
                        while (i < stops.length && percent > stops[i].p) i++;
                        const a = stops[i - 1], b = stops[i];
                        const t = (percent - a.p) / (b.p - a.p);
                        const lerp = (x, y, t) => Math.round(x + (y - x) * t);
                        const r = lerp(a.c[0], b.c[0], t);
                        const g = lerp(a.c[1], b.c[1], t);
                        const bcol = lerp(a.c[2], b.c[2], t);
                        return `rgba(${r},${g},${bcol},0.5)`;
                      ]]]
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '0.8rem' : '0.9rem'
                      ]]]
                  - font-weight: 600
                  - line-height: |
                      [[[ 
                        return window.innerWidth <= 600 ? "0.9" : "normal";
                      ]]]
                  - color: |
                      [[[ 
                        const minTemp = -40;
                        const maxTemp = 40;
                        const temp = Number(entity.state);
                        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
                        const percent = isNaN(temp) ? 0 : clamp(((temp - minTemp) / (maxTemp - minTemp)) * 100, 0, 100);
                        const stops = [
                          { p: 0,   c: [0, 0, 255, 1.0] },
                          { p: 40,c: [0, 165, 255, 1.0] },
                          { p: 65,  c: [0, 255, 0, 1.0] },
                          { p: 75,c: [255, 255, 0, 1.0] },
                          { p: 100, c: [255, 0, 0, 1.0] }
                        ];
                        let i = 1;
                        while (i < stops.length && percent > stops[i].p) i++;
                        const a = stops[i - 1], b = stops[i];
                        const t = (percent - a.p) / (b.p - a.p);
                        const lerp = (x, y, t) => Math.round(x + (y - x) * t);
                        const r = lerp(a.c[0], b.c[0], t);
                        const g = lerp(a.c[1], b.c[1], t);
                        const bcol = lerp(a.c[2], b.c[2], t);
                        return `rgba(${r},${g},${bcol},1.0)`;
                      ]]]
        styles:
          card:
            - height: 74px
            - padding: 10px 0px
            - border-radius: 12px
            - overflow: visible
            - overflow: hidden
          custom_fields:
            icon:
              - position: absolute
              - top: 55%
              - left: 4%
              - transform: translate(-50%, -50%)
            icon_border:
              - position: absolute
              - top: "[[[ return window.innerWidth <= 600 ? '56%' : '55%' ]]]"
              - left: 4%
              - transform: translate(-50%, -50%)
            name:
              - position: absolute
              - top: "[[[ return window.innerWidth <= 600 ? '1%' : '3%' ]]]"
              - left: 8%
            value:
              - position: absolute
              - top: 0%
              - right: 6.5%
              - margin-top: "-0.5%"
            unit:
              - position: absolute
              - right: 2%
              - top: 1%
              - margin-left: 1%
            min_val:
              - position: absolute
              - bottom: 2%
              - left: "[[[ return window.innerWidth <= 600 ? '34%' : '38%' ]]]"
            max_val:
              - position: absolute
              - bottom: 2%
              - right: "[[[ return window.innerWidth <= 600 ? '2%' : '4%' ]]]"
            comment:
              - position: absolute
              - top: 55%
              - left: |
                  [[[ 
                    const iconLeftPercent = 1;
                    const iconDiameterPx = window.innerWidth <= 600 ? 20 : 25;
                    const barWidthPx = window.innerWidth <= 600 ? 220 : 250;
                    const barRightPercent = window.innerWidth <= 600 ? 4 : 7;
                    const iconRightExpr = `calc(${iconLeftPercent}% + ${iconDiameterPx}px)`;
                    const barLeftExpr = `calc(100% - ${barRightPercent}% - ${barWidthPx}px)`;
                    return `calc( ( ${iconRightExpr} + ${barLeftExpr} ) / 2 )`;
                  ]]]
              - transform: translate(-50%, -50%)
            bar:
              - position: absolute
              - right: "[[[ return window.innerWidth <= 600 ? '4%' : '7%' ]]]"
              - top: 55%
              - transform: translateY(-50%)
            cursor:
              - position: absolute
              - top: "[[[ return 'calc(55% - 12.5px)'; ]]]"
              - left: |
                  [[[ 
                    const value = Number(entity.state);
                    const min = -40;
                    const max = 40;
                    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
                    const t = clamp(value, min, max);
                    const barWidth = window.innerWidth <= 600 ? 220 : 250;
                    const halfCursor = 8;
                    const barRightPercent = window.innerWidth <= 600 ? 4 : 7;
                    const percent = ((t - min) / (max - min)) * 100;
                    const offsetPx = (barWidth * percent) / 100;
                    return `calc(100% - ${barRightPercent}% - ${barWidth}px + ${offsetPx}px - ${halfCursor}px)`;
                  ]]]
        card_mod:
          style: "ha-card {\n  box-shadow: var(--couleur_ombre_bleu) !important;\n}  \_\n"
        grid_options:
          columns: 12
          rows: Auto
          
      - type: heading
        heading_style: title
        icon: mdi:weather-dust
        heading: Vent
        grid_options:
          columns: full
          rows: 0.3

      - type: custom:windrose-card
        title: Direction du vent
        data_period:
          period_back: "-4h"
        refresh_interval: 300
        windspeed_bar_location: right
        buttons_config:
          location: bottom
          buttons:
            - type: period_selector
              button_text: 1 heure
              period_back: "-1h"
            - type: period_selector
              button_text: 4 heures
              period_back: "-4h"
        wind_direction_entity:
          entity: sensor.st_00032986_direction_du_vent
          use_statistics: false
          direction_compensation: 0
        windspeed_entities:
          - entity: sensor.st_00032986_vitesse_du_vent
            name: Vitesse
            speed_unit: auto
            output_speed_unit: kph
            speed_range_beaufort: false
            windspeed_bar_full: true
            current_speed_arrow: true
            use_statistics: false
          - entity: sensor.st_00032986_rafales
            name: Rafale
            speed_unit: auto
            output_speed_unit: kph
            speed_range_beaufort: false
            windspeed_bar_full: true
            current_speed_arrow: true
            use_statistics: false
        matching_strategy:
          name: direction-first
        rose_config:
          windrose_draw_north_offset: 0
          center_calm_percentage: true
        current_direction:
          show_arrow: true
        corner_info:
          top_left:
            label: Vitesse
            unit: null
            entity: sensor.st_00032986_vitesse_du_vent
          bottom_left:
            label: Rafale
            unit: null
            entity: sensor.st_00032986_rafales
          top_right:
            label: Direction
            unit: °
            color: red
            entity: sensor.st_00032986_direction_du_vent
          bottom_right:
            label: Moyenne
            unit: null
            entity: sensor.weatherflow_direction_moyenne_du_vent
        direction_labels:
          cardinal_direction_letters: NESO
          show_cardinal_directions: true
          show_intercardinal_directions: true
          show_secondary_intercardinal_directions: true
          cardinal_directions_text_size: 60
          intercardinal_directions_text_size: 45
          secondary_intercardinal_directions_text_size: 30
        grid_options:
          columns: 12
          rows: auto
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre_bleu) !important;
            }

badges:
  - type: entity
    entity: sensor.shawinigan_sud_sensors_precipitation_today
    show_name: false
    show_state: true
    show_icon: true
    tap_action:
      action: navigate
      navigation_path: /tableau-ha/Sous-Vue-Pluie

  - type: entity
    entity: sensor.shawinigan_sud_sensors_precipitation_today
    show_name: true
    show_state: false
    show_icon: true
