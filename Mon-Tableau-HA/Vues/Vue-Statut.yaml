                                                  }

                                                  const started = new Date(value).getTime();
                                                  if (Number.isNaN(started)) return value;

                                                  const total =
                                                    Math.max(0, Math.floor((Date.now() - started) / 1000));
                                                  const days = Math.floor(total / 86400);
                                                  const hours = Math.floor((total % 86400) / 3600);
