title: Statut
path: Vue-Statuts
icon: mdi:list-status
subview: false
type: sections
max_columns: 2
cards: []
sections:
  - type: grid
    cards:
      
      - type: heading
        heading: Humidité
        icon: mdi:water-percent
        grid_options:
          columns: full
          rows: 0.4

      - type: custom:button-card
        entity: sensor.maison_humidite
        show_state: false
        show_icon: false
        show_name: false
        tap_action: none
        double_tap_action: none
        hold_action: none
        custom_fields:
          icon:
            card:
              type: custom:button-card
              icon: mdi:water
              styles:
                card:
                  - aspect-ratio: 1/1
                  - width: "[[[ return window.innerWidth <= 600 ? '20px' : '25px' ]]]"
                  - border: none
                  - border-radius: 50%
                  - background: none
                icon:
                  - width: "[[[ return window.innerWidth <= 600 ? '18px' : '20px' ]]]"
                  - color: white
          icon_border:
            card:
              type: custom:button-card
              styles:
                card:
                  - aspect-ratio: 1/1
                  - width: "[[[ return window.innerWidth <= 600 ? '23px' : '25px' ]]]"
                  - border: 1px solid white
                  - border-radius: 50%
                  - background: none
          name:
            card:
              type: custom:button-card
              name: Netatmo Humidité Intérieure
              styles:
                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '0.9rem' : '1.0rem'
                      ]]]
                  - align-self: start
                  - justify-self: start
                  - color: white
                  - font-weight: 500
          bar:
            card:
              type: custom:button-card
              show_name: false
              show_icon: false
              show_state: false
              styles:
                card:
                  - height: 6px
                  - width: >
                      [[[ return window.innerWidth <= 600 ? "220px" : "250px";
                      ]]]
                  - border-radius: 999px
                  - border: 0
                  - padding: 0
                  - background: >-
                      linear-gradient(to right, rgba(255,0,0,1.0) 0%,
                      rgba(255,165,0,1.0) 10%, rgba(255,255,0,1.0) 30%,
                      rgba(0,255,0,1.0) 50%, rgba(255,255,0,1.0) 70%,
                      rgba(255,165,0,1.0) 90%, rgba(255,0,0,1.0) 100%)
          cursor:
            card:
              type: custom:button-card
              show_name: false
              show_icon: false
              show_state: false
              styles:
                card:
                  - width: 12px
                  - height: 25px
                  - border-radius: 999px
                  - border: 4px solid rgba(42,45,54,1.0)
                  - background-color: |
                      [[[ 
                        const min = 0;
                        const max = 100;
                        const db = Number(entity.state);
                        const safe = isNaN(db) ? min : db;
                        const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));
                        const percent = clamp(((safe - min) / (max - min)) * 100, 0, 100);
                        const stops = [
                          { p: 0,   c: [255, 0,   0]  },
                          { p: 30,  c: [255, 165, 0]  },
                          { p: 40,  c: [255, 255, 0]  },
                          { p: 50,  c: [0,   255, 0]  },
                          { p: 60,  c: [255, 255, 0]  },
                          { p: 70,  c: [255, 165, 0]  },
                          { p: 100, c: [255, 0,   0]  }
                        ];
                        let i = 1;
                        while (i < stops.length && percent > stops[i].p) i++;
                        const a = stops[i - 1], b = stops[i];
                        const t = (percent - a.p) / (b.p - a.p || 1);
                        const lerp = (x, y, t) => Math.round(x + (y - x) * t);
                        const r = lerp(a.c[0], b.c[0], t);
                        const g = lerp(a.c[1], b.c[1], t);
                        const bcol = lerp(a.c[2], b.c[2], t);
                        return `rgba(${r},${g},${bcol},1.0)`;
                      ]]]
          value:
            card:
              type: custom:button-card
              show_name: false
              show_icon: false
              show_state: true
              state_display: |
                [[[ 
                  const v = Number(entity.state); 
                  return isNaN(v) ? '—' : v.toFixed(0); 
                ]]]
              styles:
                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                state:
                  - color: white
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '1.7rem' : '1.8rem'
                      ]]]
                  - font-weight: 900
          unit:
            card:
              type: custom:button-card
              name: "%"
              styles:
                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '1.0rem' : '1.3rem'
                      ]]]
                  - align-self: start
                  - justify-self: start
                  - color: rgba(167,176,205,1.0)
                  - font-weight: 800
          min_val:
            card:
              type: custom:button-card
              name: "0"
