                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '0.8rem' : '1.0rem'
                      ]]]
                  - align-self: start
                  - justify-self: start
                  - color: rgba(167,176,205,1.0)
                  - font-weight: 400
          max_val:
            card:
              type: custom:button-card
              name: "100"
              styles:
                card:
                  - width: auto
                  - padding: 0
                  - border: none
                  - border-radius: 0
                  - background: none
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '0.8rem' : '1.0rem'
                      ]]]
                  - align-self: start
                  - justify-self: start
                  - color: rgba(167,176,205,1.0)
                  - font-weight: 400
          comment:
            card:
              type: custom:button-card
              show_name: true
              show_icon: false
              show_state: false
              name: |
                [[[
                  const humidity = Number(entity.state) || 0;
                  if (humidity < 30) {
                    return "Trop sec";
                  }
                  if (humidity >= 30 && humidity < 40) {
                    return "Sec mais acceptable";
                  }
                  if (humidity >= 40 && humidity < 60) {
                    return "Zone idéale de confort";
                  }
                  if (humidity >= 60 && humidity < 70) {
                    return "Humide mais tolérable";
                  }
                  if (humidity >= 70) {
                    return "Trop humide";
                  }
                ]]]
              styles:
                card:
                  - height: 25px
                  - width: auto
                  - border-radius: 999px
                  - border: none
                  - padding: 0px 8px 0px 8px
                  - background: white
                  - background-color: |
                      [[[ 
                        const min = 0;
                        const max = 100;
                        const db = Number(entity.state);
                        const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));
                        const percent = isNaN(db) ? 0 : clamp(((db - min) / (max - min)) * 100, 0, 100);
                        const stops = [
                          { p: 0,   c: [255, 0,   0]  },
                          { p: 30,  c: [255, 165, 0]  },
                          { p: 40,  c: [255, 255, 0]  },
                          { p: 50,  c: [0,   255, 0]  },
                          { p: 60,  c: [255, 255, 0]  },
                          { p: 70,  c: [255, 165, 0]  },
                          { p: 100, c: [255, 0,   0]  }
                        ];
                        let i = 1;
                        while (i < stops.length && percent > stops[i].p) i++;
                        const a = stops[i - 1], b = stops[i];
                        const t = (percent - a.p) / (b.p - a.p || 1);
                        const lerp = (x, y, t) => Math.round(x + (y - x) * t);
                        const r = lerp(a.c[0], b.c[0], t);
                        const g = lerp(a.c[1], b.c[1], t);
                        const bcol = lerp(a.c[2], b.c[2], t);
                        return `rgba(${r},${g},${bcol},0.5)`;
                      ]]]
                name:
                  - font-size: >-
                      [[[ return window.innerWidth <= 600 ? '0.8rem' : '0.9rem'
                      ]]]
                  - font-weight: 600
                  - line-height: >
                      [[[ return window.innerWidth <= 600 ? '0.9' : 'normal';
                      ]]]
                  - color: |
                      [[[ 
                        const min = 0;
                        const max = 100;
                        const db = Number(entity.state);
                        const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));
                        const percent = isNaN(db) ? 0 : clamp(((db - min) / (max - min)) * 100, 0, 100);
                        const stops = [
                          { p: 0,   c: [255, 0,   0]  },
                          { p: 30,  c: [255, 165, 0]  },
                          { p: 40,  c: [255, 255, 0]  },
                          { p: 50,  c: [0,   255, 0]  },
                          { p: 60,  c: [255, 255, 0]  },
                          { p: 70,  c: [255, 165, 0]  },
                          { p: 100, c: [255, 0,   0]  }
                        ];
                        let i = 1;
                        while (i < stops.length && percent > stops[i].p) i++;
                        const a = stops[i - 1], b = stops[i];
                        const t = (percent - a.p) / (b.p - a.p || 1);
                        const lerp = (x, y, t) => Math.round(x + (y - x) * t);
                        const r = lerp(a.c[0], b.c[0], t);
                        const g = lerp(a.c[1], b.c[1], t);
                        const bcol = lerp(a.c[2], b.c[2], t);
                        return `rgba(${r},${g},${bcol},1.0)`;
                      ]]]
        styles:
          card:
            - height: 74px
            - padding: 10px 0px
            - border-radius: 12px
            - overflow: visible
            - overflow: hidden
          custom_fields:
            icon:
              - position: absolute
              - top: 55%
              - left: 4%
              - transform: translate(-50%, -50%)
            icon_border:
              - position: absolute
              - top: "[[[ return window.innerWidth <= 600 ? '56%' : '55%' ]]]"
              - left: 4%
              - transform: translate(-50%, -50%)
            name:
              - position: absolute
              - top: "[[[ return window.innerWidth <= 600 ? '1%' : '3%' ]]]"
              - left: 8%
            value:
              - position: absolute
              - top: "[[[ return window.innerWidth <= 600 ? '2%' : '1%' ]]]"
              - right: "[[[ return window.innerWidth <= 600 ? '8%' : '10%' ]]]"
            unit:
              - position: absolute
              - right: "[[[ return window.innerWidth <= 600 ? '3%' : '2%' ]]]"
              - top: "[[[ return window.innerWidth <= 600 ? '2%' : '1%' ]]]"
            min_val:
              - position: absolute
              - bottom: 2%
              - left: "[[[ return window.innerWidth <= 600 ? '34%' : '38%' ]]]"
            max_val:
              - position: absolute
              - bottom: 2%
              - right: "[[[ return window.innerWidth <= 600 ? '2%' : '4%' ]]]"
            comment:
              - position: absolute
              - top: 55%
              - left: |
                  [[[ 
                    const iconLeftPercent = 1;
                    const iconDiameterPx = window.innerWidth <= 600 ? 20 : 25;
                    const barWidthPx = window.innerWidth <= 600 ? 220 : 250;
                    const barRightPercent = window.innerWidth <= 600 ? 4 : 7;
                    const iconRightExpr = `calc(${iconLeftPercent}% + ${iconDiameterPx}px)`;
                    const barLeftExpr = `calc(100% - ${barRightPercent}% - ${barWidthPx}px)`;
                    return `calc( ( ${iconRightExpr} + ${barLeftExpr} ) / 2 )`;
                  ]]]
              - transform: translate(-50%, -50%)
            bar:
              - position: absolute
              - right: "[[[ return window.innerWidth <= 600 ? '4%' : '7%' ]]]"
              - top: 55%
              - transform: translateY(-50%)
            cursor:
              - position: absolute
              - top: "[[[ return 'calc(55% - 12.5px)'; ]]]"
              - left: |
                  [[[ 
                    const min = 0;
                    const max = 100;
                    const value = Number(entity.state);
                    const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));
                    const t = clamp(isNaN(value) ? min : value, min, max);
                    const barWidth = window.innerWidth <= 600 ? 220 : 250;
                    const halfCursor = 8;
                    const barRightPercent = window.innerWidth <= 600 ? 4 : 7;
                    const percent = ((t - min) / (max - min)) * 100;
                    const offsetPx = (barWidth * percent) / 100;
                    return `calc(100% - ${barRightPercent}% - ${barWidth}px + ${offsetPx}px - ${halfCursor}px)`;
                  ]]]

        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre_bleu) !important;
            }

