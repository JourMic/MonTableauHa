            - padding: 10px 0px
            - border-radius: 12px
            - overflow: visible
            - overflow: hidden
          custom_fields:
            icon:
              - position: absolute
              - top: 55%
              - left: 4%
              - transform: translate(-50%, -50%)
            icon_border:
              - position: absolute
              - top: "[[[ return window.innerWidth <= 600 ? '56%' : '55%' ]]]"
              - left: 4%
              - transform: translate(-50%, -50%)
            name:
              - position: absolute
              - top: "[[[ return window.innerWidth <= 600 ? '1%' : '3%' ]]]"
              - left: 8%
            value:
              - position: absolute
              - top: "[[[ return window.innerWidth <= 600 ? '2%' : '1%' ]]]"
              - right: "[[[ return window.innerWidth <= 600 ? '8%' : '10%' ]]]"
            unit:
              - position: absolute
              - right: "[[[ return window.innerWidth <= 600 ? '3%' : '2%' ]]]"
              - top: "[[[ return window.innerWidth <= 600 ? '2%' : '1%' ]]]"
            min_val:
              - position: absolute
              - bottom: 2%
              - left: "[[[ return window.innerWidth <= 600 ? '34%' : '38%' ]]]"
            max_val:
              - position: absolute
              - bottom: 2%
              - right: "[[[ return window.innerWidth <= 600 ? '2%' : '4%' ]]]"
            comment:
              - position: absolute
              - top: 55%
              - left: |
                  [[[ 
                    const iconLeftPercent = 1;
                    const iconDiameterPx = window.innerWidth <= 600 ? 20 : 25;
                    const barWidthPx = window.innerWidth <= 600 ? 220 : 250;
                    const barRightPercent = window.innerWidth <= 600 ? 4 : 7;
                    const iconRightExpr = `calc(${iconLeftPercent}% + ${iconDiameterPx}px)`;
                    const barLeftExpr = `calc(100% - ${barRightPercent}% - ${barWidthPx}px)`;
                    return `calc( ( ${iconRightExpr} + ${barLeftExpr} ) / 2 )`;
                  ]]]
              - transform: translate(-50%, -50%)
            bar:
              - position: absolute
              - right: "[[[ return window.innerWidth <= 600 ? '4%' : '7%' ]]]"
              - top: 55%
              - transform: translateY(-50%)
            cursor:
              - position: absolute
              - top: "[[[ return 'calc(55% - 12.5px)'; ]]]"
              - left: |
                  [[[ 
                    const min = 0;
                    const max = 120;
                    const value = Number(entity.state);
                    const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));
                    const t = clamp(isNaN(value) ? min : value, min, max);
                    const barWidth = window.innerWidth <= 600 ? 220 : 250;
                    const halfCursor = 8;
                    const barRightPercent = window.innerWidth <= 600 ? 4 : 7;
                    const percent = ((t - min) / (max - min)) * 100;
                    const offsetPx = (barWidth * percent) / 100;
                    return `calc(100% - ${barRightPercent}% - ${barWidth}px + ${offsetPx}px - ${halfCursor}px)`;
                  ]]]
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre_bleu) !important;
            }

      - type: history-graph
        grid_options:
          columns: full
          rows: auto
        entities:
          - sensor.maison_bruit
        hours_to_show: 24
        show_names: false
        min_y_axis: 30
        max_y_axis: 70
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre_bleu) !important;
            }

      - type: heading
        heading: Imprimante Canon Pro-100
        heading_style: title
        icon: mdi:printer
        badges:
          - type: entity
            entity: sensor.canon_pro_100_series
        grid_options:
          columns: full
          rows: 0.3
          
      - type: custom:auto-entities
        card:
          type: grid
          columns: 4
        card_param: cards
        filter:
          include:
            - options:
                type: gauge
#                needle: true
                min: 0
                max: 100
                severity:
                  green: 66
                  yellow: 33
                  red: 0
                card_mod:
                  style: |
                   ha-card {
                     box-shadow: var(--couleur_ombre_bleu) !important;
                   }
              attributes:
                marker_type: inkCartridge
              domain: sensor
        sort:
          method: state
          numeric: true
        show_empty: false
        grid_options:
          columns: full
          rows: auto

