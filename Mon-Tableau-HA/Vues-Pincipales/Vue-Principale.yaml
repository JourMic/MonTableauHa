title: Principale
path: Vue-principale
icon: mdi:home-account
subview: false
type: sections
max_columns: 2
cards: []
sections:
  - type: grid
    cards:
      - type: heading
        heading: "Météo"
        icon: mdi:weather-partly-rainy
        entities:
          - show_state: true
            show_icon: true
            entity: sensor.st_00032986_temperature
        grid_options:
          columns: full
          rows: 0.3

      - type: custom:sun-weather-card
        entity: weather.forecast_shawinigan_sud
        sun_entity: sun.sun
        language: system
        time_format: '24'
        forecast_type: hourly
        forecast_layout: graph
        forecast_days: 7
        transparent: false
        background_overlay: 0
        show_arc: false
        details: []
        show_time: false
        show_date: false
        visible_rows: 10
        show_forecast_toggle: false
        animated_icons: false
        location: Shawinigan
        grid_options:
          columns: 12
          rows: auto
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre_bleu) !important;
            }

      - type: heading
        heading: Personnes
        icon: mdi:account
        grid_options:
          columns: full
          rows: 0.3

      - type: custom:decluttering-card
        template: life360_personnes
        variables:
          - life360_nom: "Brigitte"
          - life360_personne: "person.brigitte"
          - life360_pile: "sensor.life360_pile_tel_brigitte"
          - life360_charge: "sensor.life360_pile_tel_en_charge_brigitte"
          - life360_deplacement: "sensor.life360_en_deplacement_brigitte"
          - life360_vitesse: "sensor.life360_vitesse_brigitte"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: life360_personnes
        variables:
          - life360_nom: "Valérie"
          - life360_personne: "person.valerie"
          - life360_pile: "sensor.life360_pile_tel_valerie"
          - life360_charge: "sensor.life360_pile_tel_en_charge_valerie"
          - life360_deplacement: "sensor.life360_en_deplacement_valerie"
          - life360_vitesse: "sensor.life360_vitesse_valerie"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: life360_personnes
        variables:
          - life360_nom: "Claude"
          - life360_personne: "person.claude"
          - life360_pile: "sensor.life360_pile_tel_claude"
          - life360_charge: "sensor.life360_pile_tel_en_charge_claude"
          - life360_deplacement: "sensor.life360_en_deplacement_claude"
          - life360_vitesse: "sensor.life360_vitesse_claude"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: life360_personnes
        variables:
          - life360_nom: "Michel"
          - life360_personne: "person.nasdemichel"
          - life360_pile: "sensor.life360_pile_tel_michel"
          - life360_charge: "sensor.life360_pile_tel_en_charge_michel"
          - life360_deplacement: "sensor.life360_en_deplacement_michel"
          - life360_vitesse: "sensor.life360_vitesse_michel"
        grid_options:
          columns: 3
          rows: auto

      - type: heading
        icon: mdi:lightbulb
        heading: Éclairages
        grid_options:
          columns: full
          rows: 0.3

      - type: custom:decluttering-card
        template: tuiles_3
        variables:
          - tuile3_entity: "light.salon"
          - tuile3_name: "Lampes"
          - tuile3_icon: "mdi:lamps"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: tuiles_3
        variables:
          - tuile3_entity: "light.lecture"
          - tuile3_name: "Lecture"
          - tuile3_icon: "mdi:desk-lamp"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: tuiles_3
        variables:
          - tuile3_entity: "switch.huche_salon"
          - tuile3_name: "Huche"
          - tuile3_icon: "hue:bulb-group-recessed-ceiling"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: tuiles_3
        variables:
          - tuile3_entity: "light.govee_tele"
          - tuile3_name: "Govee"
          - tuile3_icon: "mdi:television-ambient-light"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: tuiles_3
        variables:
          - tuile3_entity: "light.exterieure_avant"
          - tuile3_name: "Avant"
          - tuile3_icon: "hue:floor-lantern-group"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: tuiles_3
        variables:
          - tuile3_entity: "light.neviweb130_lumiere_exterieurs_arriere"
          - tuile3_name: "Arrière"
          - tuile3_icon: "hue:ceiling-fugato-two-alt"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: tuiles_3
        variables:
          - tuile3_entity: "light.salle_a_diner_table"
          - tuile3_name: "Table"
          - tuile3_icon: "hue:ensis"
        grid_options:
          columns: 3
          rows: auto

      - type: custom:decluttering-card
        template: tuiles_3
        variables:
          - tuile3_entity: "switch.vestibule_avant"
          - tuile3_name: "Vestibule"
          - tuile3_icon: "hue:ceiling-fugato-three-alt"
        grid_options:
          columns: 3
          rows: auto

  - type: grid
    cards:
    
      - type: heading
        heading: Calendrier
        icon: mdi:calendar-month-outline
        grid_options:
          columns: full
          rows: 0.3

      - type: custom:calendar-tasks-card
        calendars:
          - calendar.agenda_de_michel
          - calendar.sports_de_michel
          - calendar.anniversaires_de_michel
          - calendar.anniversaires
          - calendar.jours_feries_de_michel
        todos:
          - todo.mes_taches
        title: Agenda de Michel
        show_add_event: true
        days: 30
        allow_complete: true
        limit_events_visible: true
        max_events_visible: 3
        compact_mode: true
        grid_options:
          columns: 12
          rows: 4.1
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre_bleu) !important;
            }
            
      - type: heading
        icon: mdi:cctv
        heading: Caméras
        grid_options:
          columns: full
          rows: 0.3

      - type: custom:decluttering-card
        template: tuiles_4
        variables:
          - tuile4_entity: "alarm_control_panel.blink_ca_exterieures"
        grid_options:
          columns: 6
          rows: auto

      - type: custom:decluttering-card
        template: tuiles_4
        variables:
          - tuile4_entity: "alarm_control_panel.blink_ca_interieures"
        grid_options:
          columns: 6
          rows: auto

      - type: heading
        icon: mdi:heat-wave
        heading: Chauffage
        entities:
          - show_state: true
            show_icon: true
            entity: sensor.thermopompe_temperature
        grid_options:
          columns: full
          rows: 0.3

      - type: custom:decluttering-card
        template: tuiles_2
        variables:
          - tuile2_entity: "climate.sensibo_cuisine"
          - tuile2_name: "Cuisine"
        grid_options:
          columns: 6
          rows: auto

      - type: custom:decluttering-card
        template: tuiles_2
        variables:
          - tuile2_entity: "climate.sensibo_salle_de_repos"
          - tuile2_name: "Salle de repos"
        grid_options:
          columns: 6
          rows: auto

badges:
  - type: entity
    entity: sensor.st_00032986_vitesse_du_vent
    name: Vent
    display_type: complete
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Vent
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      box-shadow: 0 0 0 2px gray;
                    }
                cards:
                  - type: custom:ring-tile
                    entity: sensor.st_00032986_vitesse_du_vent
                    marker: sensor.st_00032986_direction_du_vent
                    ring_type: compass_nesw
                    ring_size: 3
                    top_element: marker_dir
                    middle_element: value_with_unit
                  - type: glance
                    entities:
                      - entity: sensor.shawinigan_sud_sensors_wind_lull
                        name: Acalmie
                      - entity: sensor.shawinigan_sud_sensors_wind_gust
                        name: Rafales
                      - entity: sensor.st_00032986_vitesse_moyenne_du_vent
                        name: Moyenne

  - type: entity
    entity: sensor.shawinigan_sud_sensors_precipitation_today
    name: Pluie
    display_type: complete
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Pluie
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      box-shadow: 0 0 0 2px gray;
                    }
                cards:
                  - type: custom:pluviometer-card
                    entity: sensor.shawinigan_sud_sensors_precipitation_today
                    name: Pluie Aujourd'hui
                    max_level: 60
                    show_history: true
                    secondary_name: Taux
                    battery_entity: sensor.st_00032986_batterie
                    secondary_entity: sensor.st_00032986_intensite_des_precipitations

                  - type: custom:pluviometer-card
                    entity: sensor.shawinigan_sud_sensors_precipitation_yesterday
                    name: Pluie Hier
                    max_level: 60
                    show_history: true
 
  - type: custom:lunar-phase-badge
    location_source: default
    entity: sensor.moon_phase
    southern_hemisphere: false
    language: fr
    number_decimals: 2
    mile_unit: false
    12hr_format: false
    icon_type: image
    custom_name: false
    name: phaseName
    show_name: true
    show_icon: true
    show_state: true
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Phases de la lune
          content:
            type: entities
            entities:
              - type: custom:lunar-phase-card
                entity: ""
                12hr_format: false
                calendar_modal: true
                compact_view: false
                default_card: base
                hide_buttons: false
                mile_unit: false
                moon_position: left
                number_decimals: 2
                selected_language: fr
                show_background: true
                southern_hemisphere: false
                use_custom: false
                use_default: true
                use_entity: false
                graph_config:
                  graph_type: default
                  y_ticks: false
                  x_ticks: false
                  show_time: true
                  show_current: true
                  show_highest: true
                  y_ticks_position: left
                  y_ticks_step_size: 30
                  time_step_size: 30
                font_customize:
                  header_font_size: x-large
                  header_font_style: capitalize
                  header_font_color: ""
                  label_font_size: auto
                  label_font_style: none
                  label_font_color: ""
                  hide_label: false
                latitude: 46.5135598810236
                longitude: -72.7324801683426
                location:
                  city: Shawinigan
                  country: Canada
                theme:
                  selected_theme: default
                custom_background: >-
                  https://cdn.jsdelivr.net/gh/ngocjohn/lunar-phase-card@1.7.3/background/moon_bg_3.png
                card_mod:
                  style: |
                    ha-card {
                       box-shadow: 0 0 0 2px gray;
                     }

  - type: entity
    show_name: true
    show_state: false
    show_icon: true
    entity: sensor.defi_hilo_in_progress
    icon: mdi:progress-alert
    name: Défi en cour
    color: red
    visibility:
      - condition: state
        entity: sensor.defi_hilo_in_progress
        state: "True"
    show_entity_picture: true
    display_type: minimal
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Défis Hilo
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                cards:
                  - type: markdown
                    content: >-
                      {% 
                      set data =
                      state_attr('sensor.defi_hilo','next_events')[0] 
                      %}

                      {% 
                      set montant =
                      states('sensor.defi_hilo_currentdefi_cash')
                      %}

                      {% if data is defined %}

                         <h2><center></center></h2>  
                         <ha-alert alert-type="info"><h3>
                          Défis en cour
                        </h3></ha-alert>      
                        <br>

                       <table width=100%>
                          <tr>
                            <th>Période</th>
                            <th>Permis</th>
                            <th>Utilisé</th>
                            <th>Prévus</th>
                            <th>Actuel</th>
                          </tr>  
                            <tr>
                              <td align=center>{{ data.phases.preheat_start.timestamp() | timestamp_custom('%HH%M') }}-{{ data.phases.recovery_end.timestamp() | timestamp_custom('%HH%M') }}</td>
                              <td align=center>{{ "%.1f"|format(data.allowed_kWh) }} kWh</td> 
                              <td align=center>{{ "%.1f"|format(data.used_kWh) }} kWh</td>   
                              <td align=center>{{ "%.2f"|format(max(0,data.allowed_kWh - data.used_kWh) * 0.55) }} $</td>
                              <td align=center>{{ montant }} $</td>      
                            </tr>
                       </table>
                       
                      {% else %}

                      Aucune donnée disponible

                      {% endif %}
                  - type: custom:apexcharts-card
                    experimental:
                      color_threshold: true
                    graph_span: 24h
                    show:
                      last_updated: true
                    header:
                      standard_format: false
                      show: true
                      show_states: true
                      colorize_states: true
                      title: kWh permnis et utilisé
                    span:
                      start: day
                    series:
                      - entity: sensor.defi_hilo_allowed_kwh
                        type: line
                        group_by:
                          func: last
                          duration: 15m
                        stroke_width: 5
                      - entity: sensor.defi_hilo_used_kwh
                        type: area
                        group_by:
                          func: last
                          duration: 15m
                        stroke_width: 5
                        show:
                          header_color_threshold: true
                        color_threshold:
                          - value: 0
                            color: steelblue
                          - value: 0.5
                            color: midnightblue
                          - value: 1
                            color: orange
                          - value: 1.5
                            color: orangered
                          - value: 2
                            color: red
                card_mod:
                  style: |
                    ha-card {
                      box-shadow: 0 0 0 2px gray;
                    }

  - type: entity
    entity: sensor.nombre_de_lumieres_allumees
    icon: mdi:lightbulb
    color: yellow
    visibility:
      - condition: state
        entity: sensor.nombre_de_lumieres_allumees
        state_not: "0"
    name: Allumées
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Lumières allumées
          content:
            type: entities
            entities:
              - type: custom:auto-entities
                card:
                  type: entities
                  card_mod:
                    style: |
                      ha-card {
                        box-shadow: 0 0 0 2px gray;
                      }
                filter:
                  include:
                    - entity_id: light.*
                      state: "on"
                  exclude:
                    - entity_id: light.*groupe*
                    - entity_id: light.*
                      attributes:
                        is_hue_group: true
                sort:
                  method: friendly_name
                  ignore_case: true

  - type: entity
    entity: sensor.nombre_de_mise_a_jour_total
    icon: mdi:update
    color: red
    visibility:
      - condition: state
        entity: sensor.nombre_de_mise_a_jour_total
        state_not: "0"
    name: MAJ
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Mises à jours
          content:
            type: entities
            entities:
              - type: custom:auto-entities
                filter:
                  include:
                    - entity_id: update.*
                      state: "on"
                  exclude:
                    - entity_id: update.*
                      state: "off"
                card:
                  type: custom:flex-table-card
                  card_mod:
                  style: |
                    ha-card {
                      box-shadow: 0 0 0 2px gray;
                    }
                  sort_by: friendly_name+
                  clickable: true
                  columns:
                    - data: entity_picture
                      align: center
                      name: icone
                      modify: >-
                        '<img src="' + x + '"style="height:
                        30px;width:30px">'
                    - data: friendly_name
                      align: left
                      name: " Nom"
                      modify: |-
                        x = x.replace('update', '');
                        x;
                    - data: installed_version
                      name: Installé
                      align: center
                    - data: latest_version
                      name: Dernière
                      align: center
                  css:
                    tbody tr td:nth-child(3): "color: green; font-weight: bold;"
                    tbody tr td:nth-child(4): "color: red; font-weight: bold;"
                visibility:
                  - condition: state
                    entity: sensor.nombre_de_mise_a_jour_hacs
                    state_not: "0"

              - type: custom:button-card
                entity: update.home_assistant_core_update
                show_name: false
                show_icon: false
                show_state: false
                tap_action:
                  action: none
                hold_action:
                  action: none
                styles:
                  card:
                    - padding: 0
                    - border-radius: 12px
                    - overflow: hidden
                    - background: var(--ha-card-background, var(--card-background-color))
                    - box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14)
                  grid:
                    - grid-template-areas: '"hero" "content"'
                    - grid-template-columns: 1fr
                    - grid-template-rows: auto auto
                custom_fields:
                  hero:
                    card:
                      type: custom:button-card
                      entity: update.home_assistant_core_update
                      name: Home Assistant
                      icon: mdi:home-assistant
                      show_name: true
                      show_icon: true
                      show_label: true
                      label: |-
                        [[[
                          const core = states['update.home_assistant_core_update'];
                          const version = core?.attributes?.installed_version || 'Version inconnue';
                          return `<span>Serveur domotique</span><br><span style="font-size:14px">Core ${version}</span>`;
                        ]]]
                      tap_action:
                        action: more-info
                      custom_fields:
                        status: |-
                          [[[
                            const items = [
                              ['Core','update.home_assistant_core_update'],
                              ['Supervisor','update.home_assistant_supervisor_update'],
                              ['OS','update.home_assistant_operating_system_update']
                            ];
                            const dot = (label,id) => {
                              const s = states[id]?.state;
                              const c = s === 'on' ? '#ee9a23' : s === 'off' ? '#55c878' : '#7d8a96';
                              return `<span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:${c}"></span>${label}</span>`;
                            };
                            return `<div style="display:flex;gap:7px;padding:4px 7px;border-radius:999px;background:rgba(0,0,0,.30);font-size:11px;font-weight:700">${items.map(x => dot(x[0],x[1])).join('')}</div>`;
                          ]]]
                        hint: Appuyer pour ouvrir les détails de Home Assistant
                      styles:
                        card:
                          - min-height: 98px
                          - padding: 10px
                          - border-radius: 0
                          - border: none
                          - box-shadow: none
                          - color: white
                          - background-image: >-
                              linear-gradient(115deg, rgba(20,27,36,.55),
                              rgba(68,115,158,.12)),
                              url('/local/images/home-assistant1.png')
                          - background-size: cover, 100% auto
                          - background-position: center, center top -18px
                          - background-repeat: no-repeat, no-repeat
                          - --button-card-ripple-hover-opacity: 0.2
                          - --button-card-ripple-pressed-opacity: 0.3
                          - --button-card-ripple-color: dodgerblue
                        grid:
                          - grid-template-areas: '"n i status" "l l l" "hint hint hint"'
                          - grid-template-columns: max-content 36px 1fr
                          - grid-template-rows: auto auto auto
                          - column-gap: 5px
                          - row-gap: 1px
                        icon:
                          - width: 30px
                          - color: dodgerblue
                          - justify-self: start
                          - align-self: center
                          - transform: translateY(-3px)
                        name:
                          - justify-self: start
                          - align-self: center
                          - font-size: 22px
                          - font-weight: 800
                          - letter-spacing: -0.4px
                        label:
                          - justify-self: start
                          - text-align: left
                          - font-size: 14px
                          - line-height: 1.3
                          - opacity: 1
                        custom_fields:
                          status:
                            - align-self: start
                            - justify-self: end
                          hint:
                            - justify-self: start
                            - margin-top: 2px
                            - font-size: 11px
                            - opacity: 1
                  content:
                    card:
                      type: custom:button-card
                      show_name: false
                      show_icon: false
                      tap_action:
                        action: none
                      styles:
                        card:
                          - padding: 6px
                          - border: none
                          - border-radius: 0
                          - box-shadow: none
                          - background: transparent
                        grid:
                          - grid-template-areas: >-
                              "system_title" "system_grid" "apps_title"
                              "apps_grid"
                          - grid-template-columns: 1fr
                          - grid-template-rows: repeat(4, auto)
                          - row-gap: 4px
                      custom_fields:
                        system_title:
                          card:
                            type: custom:button-card
                            name: Mises à jour système
                            icon: mdi:update
                            show_icon: true
                            show_name: true
                            tap_action:
                              action: none
                            styles:
                              card:
                                - padding: 1px 2px 0
                                - border: none
                                - box-shadow: none
                                - background: transparent
                              grid:
                                - grid-template-areas: '"i n"'
                                - grid-template-columns: 25px 1fr
                              icon:
                                - width: 18px
                                - color: '#44739e'
                              name:
                                - justify-self: start
                                - font-size: 15px
                                - font-weight: 800
                        system_grid:
                          card:
                            type: custom:button-card
                            show_name: false
                            show_icon: false
                            tap_action:
                              action: none
                            styles:
                              card:
                                - padding: 0
                                - border: none
                                - box-shadow: none
                                - background: transparent
                              grid:
                                - grid-template-areas: '"core supervisor os"'
                                - grid-template-columns: repeat(3, minmax(0, 1fr))
                                - gap: 4px
                            custom_fields:
                              core:
                                card:
                                  type: custom:button-card
                                  entity: update.home_assistant_core_update
                                  name: HA Core
                                  template: haupdate
                              supervisor:
                                card:
                                  type: custom:button-card
                                  entity: update.home_assistant_supervisor_update
                                  name: HA Supervisor
                                  template: haupdate
                              os:
                                card:
                                  type: custom:button-card
                                  entity: >-
                                    update.home_assistant_operating_system_update
                                  name: HA OS
                                  template: haupdate
                        apps_title:
                          card:
                            type: custom:button-card
                            name: Applications
                            icon: mdi:application
                            show_icon: true
                            show_name: true
                            tap_action:
                              action: none
                            styles:
                              card:
                                - padding: 1px 2px 0
