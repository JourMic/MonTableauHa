  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:progress-alert
    entity: sensor.defi_hilo_nb_defi_planifies
    name: Défi prévu
    color: red
    visibility:
      - condition: state
        entity: sensor.defi_hilo_nb_defi_planifies
        state_not: "0"
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Défis Hilo
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                cards:
                  - type: custom:stack-in-card
                    mode: vertical
                    title: ❄️⚡Défis Hilo à venir⚡❄️
                    card_mod:
                      style: |
                        ha-card {
                          {% if states('sensor.defi_hilo_count')|int > 0 %}
                          animation: dropshadow-change 2s linear infinite
                          {% endif %}
                        }

                        @keyframes dropshadow-change {
                          0% { filter: drop-shadow(0px 0px 2px rgba(0, 0, 0, 0)); }
                          50% { filter: drop-shadow(0px 0px 8px cyan); }
                          100% { filter: drop-shadow(0px 0px 2px rgba(0, 0, 0, 0)); }
                        }
                    cards:
                      - type: markdown
                        visibility:
                          - condition: numeric_state
                            entity: sensor.defi_hilo_count
                            below: 1
                        content: |
                          ### Aucun défi annoncé!
                        card_mod:
                          style: |
                            ha-card {
                              border-radius:0px;
                              border-style: none;
                            }
                      - type: custom:decluttering-card
                        template: defi_hilo_card
                        variables:
                          - id: 0
                      - type: custom:decluttering-card
                        template: defi_hilo_card
                        variables:
                          - id: 1
                      - type: custom:decluttering-card
                        template: defi_hilo_card
                        variables:
                          - id: 2
                card_mod:
                  style: |
                    ha-card {
                       box-shadow: 0 0 0 2px gray;
                    }

  - type: entity
    show_name: true
    show_state: false
    show_icon: true
    entity: sensor.shawinigan_resume
    name: Alerte
    icon: mdi:alert
    color: red
    visibility:
      - condition: or
        conditions:
          - condition: state
            entity: sensor.shawinigan_avis
            state_not: "0"
          - condition: state
            entity: sensor.shawinigan_terminaisons
            state_not: "0"
          - condition: state
            entity: sensor.shawinigan_bulletins
            state_not: "0"
          - condition: state
            entity: sensor.shawinigan_veilles
            state_not: "0"
          - condition: state
            entity: sensor.shawinigan_alertes
            state_not: "0"
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Avis en cour
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                cards:
                - type: markdown
                  content: |2
                        {% if is_number(states('sensor.shawinigan_avis')) and states('sensor.shawinigan_avis') | int == 0 and 
                              is_number(states('sensor.shawinigan_bulletins')) and states('sensor.shawinigan_bulletins') | int == 0 and 
                              is_number(states('sensor.shawinigan_alertes')) and states('sensor.shawinigan_alertes') | int == 0 and 
                              is_number(states('sensor.shawinigan_veilles')) and states('sensor.shawinigan_veilles') | int == 0 and 
                              is_number(states('sensor.shawinigan_terminaisons')) and states('sensor.shawinigan_terminaisons') | int == 0  %}

                                <ha-alert alert-type="info">Aucune alerte présentement</ha-alert>                                      
                        {% else %}
                            {% set x = [ 'sensor.shawinigan_avis', 'sensor.shawinigan_bulletins', 'sensor.shawinigan_alertes', 'sensor.shawinigan_veilles', 'sensor.shawinigan_terminaisons' ] %}

                            {% for state in states.sensor if state.entity_id in x %}
                              {% for attr in state.attributes %}
                                {%- if attr.startswith('alert_') %}
                                  {%- if attr.startswith('alert_time_') %}
                                      {{ state_attr(state.entity_id, attr) }}</ha-alert>
                                  {% else %}
                                      {{'\n'}}<ha-alert alert-type="warning" title="{{ state_attr(state.entity_id,'friendly_name') }}">{{ state_attr(state.entity_id, attr) }}
                                  {%- endif %}
                                {%- endif %}
                              {%- endfor %}
                            {% endfor %}
                        {% endif %}
                card_mod:
                  style: |
                    ha-card {
                       box-shadow: 0 0 0 2px gray;
                    }

