  - type: entity
    show_name: true
    show_state: false
    show_icon: true
    entity: sensor.defi_hilo_in_progress
    icon: mdi:progress-alert
    name: Défi en cour
    color: red
    visibility:
      - condition: state
        entity: sensor.defi_hilo_in_progress
        state: "True"
    show_entity_picture: true
    display_type: minimal
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Défis Hilo
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                cards:
                  - type: markdown
                    content: >-
                      {% 
                      set data =
                      state_attr('sensor.defi_hilo','next_events')[0] 
                      %}

                      {% 
                      set montant =
                      states('sensor.defi_hilo_currentdefi_cash')
                      %}

                      {% if data is defined %}

                         <h2><center></center></h2>  
                         <ha-alert alert-type="info"><h3>
                          Défis en cour
                        </h3></ha-alert>      
                        <br>

                       <table width=100%>
                          <tr>
                            <th>Période</th>
                            <th>Permis</th>
                            <th>Utilisé</th>
                            <th>Prévus</th>
                            <th>Actuel</th>
                          </tr>  
                            <tr>
                              <td align=center>{{ data.phases.preheat_start.timestamp() | timestamp_custom('%HH%M') }}-{{ data.phases.recovery_end.timestamp() | timestamp_custom('%HH%M') }}</td>
                              <td align=center>{{ "%.1f"|format(data.allowed_kWh) }} kWh</td> 
                              <td align=center>{{ "%.1f"|format(data.used_kWh) }} kWh</td>   
                              <td align=center>{{ "%.2f"|format(max(0,data.allowed_kWh - data.used_kWh) * 0.45) }} $</td>
                              <td align=center>{{ montant }} $</td>      
                            </tr>
                       </table>
                       
                      {% else %}

                      Aucune donnée disponible

                      {% endif %}
                  - type: custom:apexcharts-card
                    experimental:
                      color_threshold: true
                    graph_span: 24h
                    show:
                      last_updated: true
                    header:
                      standard_format: false
                      show: true
                      show_states: true
                      colorize_states: true
                      title: kWh permnis et utilisé
                    span:
                      start: day
                    series:
                      - entity: sensor.defi_hilo_allowed_kwh
                        type: line
                        group_by:
                          func: last
                          duration: 15m
                        stroke_width: 5
                      - entity: sensor.defi_hilo_used_kwh
                        type: area
                        group_by:
                          func: last
                          duration: 15m
                        stroke_width: 5
                        show:
                          header_color_threshold: true
                        color_threshold:
                          - value: 0
                            color: steelblue
                          - value: 0.4
                            color: midnightblue
                          - value: 1
                            color: orange
                          - value: 1.5
                            color: orangered
                          - value: 2
                            color: red
                card_mod:
                  style: |
                    ha-card {
                      box-shadow: 0 0 0 2px gray;
                    }

  - type: entity
    entity: sensor.nombre_de_lumieres_allumees
    icon: mdi:lightbulb
    color: yellow
    visibility:
      - condition: state
        entity: sensor.nombre_de_lumieres_allumees
        state_not: "0"
    name: Allumées
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Lumières allumées
          content:
            type: entities
            entities:
              - type: custom:auto-entities
                card:
                  type: entities
                  card_mod:
                    style: |
                      ha-card {
                        box-shadow: 0 0 0 2px gray;
                      }
                filter:
                  include:
                    - entity_id: light.*
                      state: "on"
                  exclude:
                    - entity_id: light.*groupe*
                    - entity_id: light.*
                      attributes:
                        is_hue_group: true
                sort:
                  method: friendly_name
                  ignore_case: true

  - type: entity
    entity: sensor.nombre_de_mise_a_jour_total
    icon: mdi:update
    color: red
    visibility:
      - condition: state
        entity: sensor.nombre_de_mise_a_jour_total
        state_not: "0"
    name: MAJ
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Mises à jours
          content:
            type: entities
            entities:
              - type: custom:auto-entities
                filter:
                  include:
                    - entity_id: update.*
                      state: "on"
                  exclude:
                    - entity_id: update.*
                      state: "off"
                card:
                  type: custom:flex-table-card
                  card_mod:
                  style: |
                    ha-card {
                      box-shadow: 0 0 0 2px gray;
                    }
                  sort_by: friendly_name+
                  clickable: true
                  columns:
                    - data: entity_picture
                      align: center
                      name: icone
                      modify: >-
                        '<img src="' + x + '"style="height:
                        30px;width:30px">'
                    - data: friendly_name
                      align: left
                      name: " Nom"
                      modify: |-
                        x = x.replace('update', '');
                        x;
                    - data: installed_version
                      name: Installé
                      align: center
                    - data: latest_version
                      name: Dernière
                      align: center
                  css:
                    tbody tr td:nth-child(3): "color: green; font-weight: bold;"
                    tbody tr td:nth-child(4): "color: red; font-weight: bold;"
                visibility:
                  - condition: state
                    entity: sensor.nombre_de_mise_a_jour_hacs
                    state_not: "0"

  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:progress-alert
    entity: sensor.defi_hilo_nb_defi_planifies
    name: Défi prévu
    color: red
    visibility:
      - condition: state
        entity: sensor.defi_hilo_nb_defi_planifies
        state_not: "0"
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Défis Hilo
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                cards:
                  - type: custom:stack-in-card
                    mode: vertical
                    title: ❄️⚡Défis Hilo à venir⚡❄️
                    card_mod:
                      style: |
                        ha-card {
                          {% if states('sensor.defi_hilo_count')|int > 0 %}
                          animation: dropshadow-change 2s linear infinite
                          {% endif %}
                        }

                        @keyframes dropshadow-change {
                          0% { filter: drop-shadow(0px 0px 2px rgba(0, 0, 0, 0)); }
                          50% { filter: drop-shadow(0px 0px 8px cyan); }
                          100% { filter: drop-shadow(0px 0px 2px rgba(0, 0, 0, 0)); }
                        }
                    cards:
                      - type: markdown
                        visibility:
                          - condition: numeric_state
                            entity: sensor.defi_hilo_count
                            below: 1
                        content: |
                          ### Aucun défi annoncé!
                        card_mod:
                          style: |
                            ha-card {
                              border-radius:0px;
                              border-style: none;
                            }
                      - type: custom:decluttering-card
                        template: defi_hilo_card
                        variables:
                          - id: 0
                      - type: custom:decluttering-card
                        template: defi_hilo_card
                        variables:
                          - id: 1
                      - type: custom:decluttering-card
                        template: defi_hilo_card
                        variables:
                          - id: 2
                card_mod:
                  style: |
                    ha-card {
                       box-shadow: 0 0 0 2px gray;
                    }

  - type: entity
    show_name: true
    show_state: false
    show_icon: true
    entity: sensor.shawinigan_resume
    name: Alerte
    icon: mdi:alert
    color: red
    visibility:
      - condition: or
        conditions:
          - condition: state
            entity: sensor.shawinigan_avis
            state_not: "0"
          - condition: state
            entity: sensor.shawinigan_terminaisons
            state_not: "0"
          - condition: state
            entity: sensor.shawinigan_bulletins
            state_not: "0"
          - condition: state
            entity: sensor.shawinigan_veilles
            state_not: "0"
          - condition: state
            entity: sensor.shawinigan_alertes
            state_not: "0"
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Avis en cour
          content:
            type: entities
            entities:
              - type: custom:vertical-stack-in-card
                cards:
                - type: markdown
                  content: |2
                        {% if is_number(states('sensor.shawinigan_avis')) and states('sensor.shawinigan_avis') | int == 0 and 
                              is_number(states('sensor.shawinigan_bulletins')) and states('sensor.shawinigan_bulletins') | int == 0 and 
                              is_number(states('sensor.shawinigan_alertes')) and states('sensor.shawinigan_alertes') | int == 0 and 
                              is_number(states('sensor.shawinigan_veilles')) and states('sensor.shawinigan_veilles') | int == 0 and 
                              is_number(states('sensor.shawinigan_terminaisons')) and states('sensor.shawinigan_terminaisons') | int == 0  %}

                                <ha-alert alert-type="info">Aucune alerte présentement</ha-alert>                                      
                        {% else %}
                            {% set x = [ 'sensor.shawinigan_avis', 'sensor.shawinigan_bulletins', 'sensor.shawinigan_alertes', 'sensor.shawinigan_veilles', 'sensor.shawinigan_terminaisons' ] %}

                            {% for state in states.sensor if state.entity_id in x %}
                              {% for attr in state.attributes %}
                                {%- if attr.startswith('alert_') %}
                                  {%- if attr.startswith('alert_time_') %}
                                      {{ state_attr(state.entity_id, attr) }}</ha-alert>
                                  {% else %}
                                      {{'\n'}}<ha-alert alert-type="warning" title="{{ state_attr(state.entity_id,'friendly_name') }}">{{ state_attr(state.entity_id, attr) }}
                                  {%- endif %}
                                {%- endif %}
                              {%- endfor %}
                            {% endfor %}
                        {% endif %}
                card_mod:
                  style: |
                    ha-card {
                       box-shadow: 0 0 0 2px gray;
                    }

